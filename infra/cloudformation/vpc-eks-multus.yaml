AWSTemplateFormatVersion: 2010-09-09
Description: >-
  IND321 Autonomous Networks LCM & Operations - VPC, EKS Cluster (Multus enabled),
  4 Multus subnets (N2/N3/N4/N6) aligned to the free5gc + packetrusher helm chart IP plan,
  a Linux bastion host and a single EKS Managed Node Group that hosts both free5gc core
  and the packetrusher UE/gNB simulator.

Metadata:
  "AWS::CloudFormation::Interface":
    ParameterGroups:
      - Label:
          default: VPC Configuration
        Parameters:
          - VpcCidr
          - AvailabilityZones
          - PubMgmtSubnetAz1Cidr
          - PubMgmtSubnetAz2Cidr
          - PrivK8sSubnetAz1Cidr
          - PrivK8sSubnetAz2Cidr
      - Label:
          default: Multus networks (must match free5gc/packetrusher helm values)
        Parameters:
          - MultusN2SubnetCidr
          - MultusN3SubnetCidr
          - MultusN4SubnetCidr
          - MultusN6SubnetCidr
      - Label:
          default: Bastion Configuration
        Parameters:
          - BastionInstanceType
          - BastionKeyPairName
          - LatestAmiId
          - BastionAmiIdOverride
      - Label:
          default: EKS Worker Node Configuration
        Parameters:
          - EksVersion
          - EksWorkerKeyName
          - NodeAutoScalingGroupMinSize
          - NodeAutoScalingGroupDesiredCapacity
          - NodeAutoScalingGroupMaxSize
          - NodeInstanceType
          - NodeVolumeSize
          - CapacityType
          - NodeAmiType

Parameters:
  AvailabilityZones:
    Description: List of Availability Zones to use for the subnets in the VPC. Select 2 of them.
    AllowedPattern: ".+"
    Type: List<AWS::EC2::AvailabilityZone::Name>
  VpcCidr:
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
    ConstraintDescription: CIDR block parameter must be in the form x.x.x.x/16-28
    Default: 10.100.0.0/16
    Description: CIDR block for the VPC.
    Type: String
  AllowedExternalAccessCidr:
    Type: String
    Default: 127.0.0.1/32
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(?:[0-9]|[12][0-9]|3[0-2]))$
    Description: CIDR allowed to reach bastion and worker SSH/web ports. Keep 127.0.0.1/32 when using SSM port forwarding.
  PubMgmtSubnetAz1Cidr:
    Default: 10.100.0.0/24
    Description: CIDR block for the Public Management Subnet in AZ1.
    Type: String
  PubMgmtSubnetAz2Cidr:
    Default: 10.100.1.0/24
    Description: CIDR block for the Public Management Subnet in AZ2.
    Type: String
  PrivK8sSubnetAz1Cidr:
    Default: 10.100.2.0/24
    Description: CIDR block for the Private K8s Subnet in AZ1 (primary pod network).
    Type: String
  PrivK8sSubnetAz2Cidr:
    Default: 10.100.3.0/24
    Description: CIDR block for the Private K8s Subnet in AZ2 (primary pod network).
    Type: String
  MultusN2SubnetCidr:
    Default: 10.100.4.0/24
    Description: CIDR for the N2 Multus network (AMF SCTP / gNB). Maps to ens6. Must match helm values.
    Type: String
  MultusN3SubnetCidr:
    Default: 10.100.5.0/24
    Description: CIDR for the N3 Multus network (GTP-U user plane). Maps to ens7. Must match helm values.
    Type: String
  MultusN4SubnetCidr:
    Default: 10.100.6.0/24
    Description: CIDR for the N4 Multus network (PFCP SMF<->UPF). Maps to ens8. Must match helm values.
    Type: String
  MultusN6SubnetCidr:
    Default: 10.100.7.0/24
    Description: CIDR for the N6 Multus network (UPF data network). Maps to ens9. Must match helm values.
    Type: String
  BastionKeyPairName:
    Description: Name of an existing EC2 key pair for SSH access to the bastion.
    Type: AWS::EC2::KeyPair::KeyName
    AllowedPattern: ".+"
  BastionInstanceType:
    Type: String
    Default: t3.medium
    Description: Instance type for the bastion host.
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2'
  BastionAmiIdOverride:
    Type: String
    Default: ''
    AllowedPattern: '^$|^ami-[0-9a-f]+$'
    Description: Optional explicit AMI ID. Set this on existing stacks to prevent unrelated updates from replacing the bastion when LatestAmiId advances.
  EksVersion:
    Type: String
    Default: "1.33"
    Description: Kubernetes version for the EKS cluster.
  EksWorkerKeyName:
    Type: "AWS::EC2::KeyPair::KeyName"
    Description: The EC2 Key Pair for SSH access to the EKS worker instances.
    AllowedPattern: ".+"
  NodeAutoScalingGroupDesiredCapacity:
    Type: Number
    Default: "2"
    Description: Desired capacity of the Node Group ASG.
  NodeAutoScalingGroupMaxSize:
    Type: Number
    Default: "3"
    Description: Maximum size of the Node Group ASG.
  NodeAutoScalingGroupMinSize:
    Type: Number
    Default: "2"
    Description: Minimum size of the Node Group ASG.
  NodeInstanceType:
    Type: String
    Default: m6i.4xlarge
    ConstraintDescription: Must be a valid EC2 instance type.
    Description: EC2 instance type for the worker nodes.
  NodeVolumeSize:
    Type: Number
    Default: "40"
    Description: Node root volume size (GB).
  NodeAmiType:
    Type: String
    Default: "AL2023_x86_64_STANDARD"
    Description: Node AMI type.
  CapacityType:
    Type: String
    Default: "ON_DEMAND"
    Description: EC2 capacity type.

Conditions:
  UseBastionAmiIdOverride: !Not [!Equals [!Ref BastionAmiIdOverride, '']]

Resources:
  Vpc:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "vpc-${AWS::StackName}"

  VpcIgw:
    Type: 'AWS::EC2::InternetGateway'
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "igw-${AWS::StackName}"
  VpcIgwAttach:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref VpcIgw

  #### Public Management Subnets ####
  PubMgmtSubnetAz1:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PubMgmtSubnetAz1Cidr
      AvailabilityZone: !Select ['0', !Ref AvailabilityZones]
      Tags:
        - Key: kubernetes.io/role/elb
          Value: 1
        - Key: Name
          Value: !Sub "pubMgmt-Az1-${AWS::StackName}"
  PubMgmtSubnetAz2:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PubMgmtSubnetAz2Cidr
      AvailabilityZone: !Select ['1', !Ref AvailabilityZones]
      Tags:
        - Key: kubernetes.io/role/elb
          Value: 1
        - Key: Name
          Value: !Sub "pubMgmt-Az2-${AWS::StackName}"
  PubMgmtSubnetRt:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "pubMgmt-SubnetRt-${AWS::StackName}"
  PubMgmtRtDfltRt:
    Type: 'AWS::EC2::Route'
    DependsOn: VpcIgwAttach
    Properties:
      RouteTableId: !Ref PubMgmtSubnetRt
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref VpcIgw
  PubMgmtAz1RtAssoc:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref PubMgmtSubnetAz1
      RouteTableId: !Ref PubMgmtSubnetRt
  PubMgmtAz2RtAssoc:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref PubMgmtSubnetAz2
      RouteTableId: !Ref PubMgmtSubnetRt

  #### NAT Gateways (one per AZ) ####
  EipNatGwAz1:
    Type: 'AWS::EC2::EIP'
    Properties:
      Domain: Vpc
  NatGatewayAz1:
    Type: 'AWS::EC2::NatGateway'
    Properties:
      AllocationId: !GetAtt 'EipNatGwAz1.AllocationId'
      SubnetId: !Ref PubMgmtSubnetAz1
      Tags:
        - Key: Name
          Value: !Sub "natGwAz1-${AWS::StackName}"
  EipNatGwAz2:
    Type: 'AWS::EC2::EIP'
    Properties:
      Domain: Vpc
  NatGatewayAz2:
    Type: 'AWS::EC2::NatGateway'
    Properties:
      AllocationId: !GetAtt 'EipNatGwAz2.AllocationId'
      SubnetId: !Ref PubMgmtSubnetAz2
      Tags:
        - Key: Name
          Value: !Sub "natGwAz2-${AWS::StackName}"

  #### Private K8s Subnets ####
  PrivK8sSubnetAz1:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivK8sSubnetAz1Cidr
      AvailabilityZone: !Select ['0', !Ref AvailabilityZones]
      Tags:
        - Key: kubernetes.io/role/internal-elb
          Value: 1
        - Key: Name
          Value: !Sub "PrivK8s-Az1-${AWS::StackName}"
  PrivK8sSubnetAz2:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivK8sSubnetAz2Cidr
      AvailabilityZone: !Select ['1', !Ref AvailabilityZones]
      Tags:
        - Key: kubernetes.io/role/internal-elb
          Value: 1
        - Key: Name
          Value: !Sub "PrivK8s-Az2-${AWS::StackName}"
  PrivK8sAz1SubnetRt:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "PrivK8sAz1SubnetRt-${AWS::StackName}"
  PrivK8sAz2SubnetRt:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "PrivK8sAz2SubnetRt-${AWS::StackName}"
  PrivK8sAz1Rt1:
    Type: 'AWS::EC2::Route'
    Properties:
      RouteTableId: !Ref PrivK8sAz1SubnetRt
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref NatGatewayAz1
  PrivK8sAz2Rt1:
    Type: 'AWS::EC2::Route'
    Properties:
      RouteTableId: !Ref PrivK8sAz2SubnetRt
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref NatGatewayAz2
  PrivK8sAz1RtAssoc:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref PrivK8sSubnetAz1
      RouteTableId: !Ref PrivK8sAz1SubnetRt
  PrivK8sAz2RtAssoc:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref PrivK8sSubnetAz2
      RouteTableId: !Ref PrivK8sAz2SubnetRt

  #### VPC-wide "allow all" SG used for Multus ENIs ####
  VpcSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "MultusEni-Sg-${AWS::StackName}"
      GroupDescription: VPC-scoped security group for Multus ENIs (workshop use).
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - CidrIp: !Ref VpcCidr
          IpProtocol: '-1'
          FromPort: 0
          ToPort: 65535
      Tags:
        - Key: "Name"
          Value: !Sub "MultusEni-Sg-${AWS::StackName}"

  #### Multus subnets - all in AZ1 so the single nodegroup ENIs are co-located ####
  MultusN2Subnet:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref MultusN2SubnetCidr
      AvailabilityZone: !Select ['0', !Ref AvailabilityZones]
      Tags:
        - Key: Name
          Value: !Sub "MultusN2-${AWS::StackName}"
  MultusN3Subnet:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref MultusN3SubnetCidr
      AvailabilityZone: !Select ['0', !Ref AvailabilityZones]
      Tags:
        - Key: Name
          Value: !Sub "MultusN3-${AWS::StackName}"
  MultusN4Subnet:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref MultusN4SubnetCidr
      AvailabilityZone: !Select ['0', !Ref AvailabilityZones]
      Tags:
        - Key: Name
          Value: !Sub "MultusN4-${AWS::StackName}"
  MultusN6Subnet:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref MultusN6SubnetCidr
      AvailabilityZone: !Select ['0', !Ref AvailabilityZones]
      Tags:
        - Key: Name
          Value: !Sub "MultusN6-${AWS::StackName}"
  MultusAz1SubnetRt:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "MultusAz1SubnetRt-${AWS::StackName}"
  MultusAz1DfltRt:
    Type: 'AWS::EC2::Route'
    Properties:
      RouteTableId: !Ref MultusAz1SubnetRt
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref NatGatewayAz1
  MultusN2RtAssoc:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref MultusN2Subnet
      RouteTableId: !Ref MultusAz1SubnetRt
  MultusN3RtAssoc:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref MultusN3Subnet
      RouteTableId: !Ref MultusAz1SubnetRt
  MultusN4RtAssoc:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref MultusN4Subnet
      RouteTableId: !Ref MultusAz1SubnetRt
  MultusN6RtAssoc:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref MultusN6Subnet
      RouteTableId: !Ref MultusAz1SubnetRt

  #############################################################################
  # IAM role for the bastion host (manages the EKS cluster + helm/kubectl)
  #############################################################################
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      Description: IAM Role for the bastion host used to manage the EKS cluster.
      RoleName: !Sub "BastionEC2Role-${AWS::StackName}"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryFullAccess
      Policies:
        - PolicyName: BastionCustomPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:GetOpenIDConnectProvider
                  - iam:ListOpenIDConnectProviders
                  - iam:CreateOpenIDConnectProvider
                  - iam:TagOpenIDConnectProvider
                  - eks:*
                  - ec2:Describe*
                  - logs:*
                  - cloudformation:*
                  # Allow the bastion to run gtp5g install/verify on worker nodes
                  # via SSM (used by 02-configure-cluster.sh).
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ssm:DescribeInstanceInformation
                Resource: "*"
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable SSH and webui access to the bastion.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedExternalAccessCidr
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp: !Ref AllowedExternalAccessCidr
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: !Ref AllowedExternalAccessCidr
        - IpProtocol: '-1'
          FromPort: -1
          ToPort: -1
          CidrIp: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: !Sub "bastion-Sg-${AWS::StackName}"

  BastionInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref BastionInstanceType
      KeyName: !Ref BastionKeyPairName
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: "0"
          GroupSet:
            - !Ref BastionSecurityGroup
          SubnetId: !Ref PubMgmtSubnetAz1
      ImageId: !If [UseBastionAmiIdOverride, !Ref BastionAmiIdOverride, !Ref LatestAmiId]
      Tags:
        - Key: Name
          Value: !Sub "BastionHost-${AWS::StackName}"
      UserData:
        Fn::Base64: !Sub |
          MIME-Version: 1.0
          Content-Type: multipart/mixed; boundary="==BOUNDARY=="

          --==BOUNDARY==
          Content-Type: text/x-shellscript; charset="us-ascii"

          #!/bin/bash
          set -o xtrace
          sudo curl --silent --location -o installTools.sh https://raw.githubusercontent.com/aws-samples/karpenter-with-multus-on-eks/main/tools/installTools.sh
          sudo chmod +x installTools.sh
          ./installTools.sh
          --==BOUNDARY==--

  #############################################################################
  # EKS cluster
  #############################################################################
  EksIamRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - eks.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      RoleName: !Sub "eksIamRole-${AWS::StackName}"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSServicePolicy
  EksControlSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Cluster communication with worker nodes.
      VpcId: !Ref Vpc

  EksNodeRole:
    Type: AWS::IAM::Role
    Properties:
      Description: IAM Role for the EKS worker nodes.
      RoleName: !Sub "eksNodeRole-${AWS::StackName}"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: Ec2ApiAccessPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:Get*
                  - s3:List*
                  - ec2:AssignPrivateIpAddresses
                  - ec2:AssignIpv6Addresses
                  - ec2:DescribeInstances
                  - ec2:DescribeSubnets
                  - ec2:DescribeNetworkInterfaces
                  - ec2:CreateNetworkInterface
                  - ec2:AttachNetworkInterface
                  - ec2:ModifyNetworkInterfaceAttribute
                  - ec2:ModifyInstanceMetadataOptions
                  - ec2:UnassignIpv6Addresses
                  - ec2:UnassignPrivateIpAddresses
                  - ec2:DescribeVpcs
                  - ec2:CreateRoute
                  - ec2:DeleteRoute
                  - ec2:ReplaceRoute
                  - ec2:DescribeNetworkInterfacePermissions
                  - ec2:DescribeAddresses
                  - ec2:AssociateAddress
                  - ec2:DisassociateAddress
                  - sts:AssumeRole
                  # Workshop-only node credentials used by ANDA/ANRA. For a
                  # non-workshop deployment, replace this with EKS Pod Identity.
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:ListInferenceProfiles
                  - bedrock:GetInferenceProfile
                  - ec2:CreateVolume
                  - ec2:DeleteVolume
                  - ec2:AttachVolume
                  - ec2:DetachVolume
                  - ec2:DescribeVolumes
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource: "*"

  EksCluster:
    Type: AWS::EKS::Cluster
    DependsOn: [EksIamRole, PubMgmtSubnetAz1, PubMgmtSubnetAz2, PrivK8sSubnetAz1, PrivK8sSubnetAz2, EksControlSecurityGroup]
    Properties:
      Name: !Sub "eks-${AWS::StackName}"
      Version: !Ref EksVersion
      RoleArn: !GetAtt EksIamRole.Arn
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
      ResourcesVpcConfig:
        SecurityGroupIds:
          - !Ref EksControlSecurityGroup
        SubnetIds:
          - !Ref PubMgmtSubnetAz1
          - !Ref PubMgmtSubnetAz2
          - !Ref PrivK8sSubnetAz1
          - !Ref PrivK8sSubnetAz2
        EndpointPublicAccess: false
        EndpointPrivateAccess: true
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
            - Type: authenticator

  #### Allow in-VPC clients (e.g. the bastion) to reach the EKS API server. ####
  # With private endpoint access enabled, VPC DNS resolves the API endpoint to a
  # private ENI IP. Without this rule the bastion's HTTPS call to the API server
  # times out. Scoped to the VPC CIDR (workshop use).
  EksApiFromVpcIngress:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn: [EksCluster]
    Properties:
      Description: Allow HTTPS to the EKS API server from inside the VPC (bastion access).
      GroupId: !GetAtt EksCluster.ClusterSecurityGroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref VpcCidr

  #### EKS add-ons ####
  EksEbsCsiPodIdentityRole:
    Type: AWS::IAM::Role
    Properties:
      Description: IAM role used only by the EBS CSI controller through EKS Pod Identity.
      RoleName: !Sub "eksEbsCsiPodIdentityRole-${AWS::StackName}"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowEksAuthToAssumeRoleForPodIdentity
            Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Condition:
              StringEquals:
                aws:RequestTag/kubernetes-namespace: kube-system
                aws:RequestTag/kubernetes-service-account: ebs-csi-controller-sa
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy

  EksClusterVpcCniAddon:
    Type: AWS::EKS::Addon
    DependsOn: [EksCluster]
    Properties:
      AddonName: vpc-cni
      AddonVersion: v1.20.4-eksbuild.1
      ResolveConflicts: OVERWRITE
      ClusterName: !Ref EksCluster
  EksClusterKubeProxyAddon:
    Type: AWS::EKS::Addon
    DependsOn: [EksCluster]
    Properties:
      AddonName: kube-proxy
      ClusterName: !Ref EksCluster
  EksClusterCoreDnsAddon:
    Type: AWS::EKS::Addon
    DependsOn: [EksNodeGroup]
    Properties:
      AddonName: coredns
      ClusterName: !Ref EksCluster
  EksClusterPodIdentityAgentAddon:
    Type: AWS::EKS::Addon
    DependsOn: [EksNodeGroup]
    Properties:
      AddonName: eks-pod-identity-agent
      AddonVersion: v1.3.10-eksbuild.3
      ResolveConflicts: OVERWRITE
      ClusterName: !Ref EksCluster
  EksClusterEBSAddon:
    Type: AWS::EKS::Addon
    DependsOn: [EksClusterPodIdentityAgentAddon]
    Properties:
      AddonName: aws-ebs-csi-driver
      ClusterName: !Ref EksCluster
      ResolveConflicts: OVERWRITE
      PodIdentityAssociations:
        - ServiceAccount: ebs-csi-controller-sa
          RoleArn: !GetAtt EksEbsCsiPodIdentityRole.Arn

  #### Node security group ####
  EksNodeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EKS worker nodes.
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "EksNode-sg-${AWS::StackName}"
  EksNodeSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn: EksNodeSecurityGroup
    Properties:
      Description: Allow nodes to communicate with each other.
      FromPort: 0
      GroupId: !Ref EksNodeSecurityGroup
      IpProtocol: "-1"
      SourceSecurityGroupId: !Ref EksNodeSecurityGroup
      ToPort: 65535
  NodeSecurityGroupFromControlPlaneIngress:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn: [EksNodeSecurityGroup, EksCluster]
    Properties:
      Description: Allow worker Kubelets and pods to receive communication from the control plane.
      GroupId: !Ref EksNodeSecurityGroup
      SourceSecurityGroupId: !GetAtt EksCluster.ClusterSecurityGroupId
      IpProtocol: '-1'
      FromPort: -1
      ToPort: -1
  ClusterControlPlaneSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn: [EksNodeSecurityGroup, EksCluster]
    Properties:
      Description: Allow pods to communicate with the cluster API server.
      SourceSecurityGroupId: !Ref EksNodeSecurityGroup
      GroupId: !GetAtt EksCluster.ClusterSecurityGroupId
      IpProtocol: '-1'
      FromPort: -1
      ToPort: -1
  EksNodeSecurityGroupIngressVPCCidr:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn: EksNodeSecurityGroup
    Properties:
      Description: Allow all traffic from the VPC CIDR.
      FromPort: -1
      GroupId: !Ref EksNodeSecurityGroup
      IpProtocol: "-1"
      CidrIp: !Ref VpcCidr
      ToPort: -1
  EksNodeSecurityGroupIngressSsh:
    Type: AWS::EC2::SecurityGroupIngress
    DependsOn: EksNodeSecurityGroup
    Properties:
      Description: SSH access.
      FromPort: 22
      GroupId: !Ref EksNodeSecurityGroup
      IpProtocol: TCP
      CidrIp: !Ref AllowedExternalAccessCidr
      ToPort: 22

  #### Launch template - free5gc + packetrusher node (Multus ENIs + GTP5G) ####
  EksMngLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    DependsOn: [NodeSecurityGroupFromControlPlaneIngress, ClusterControlPlaneSecurityGroupIngress, EksNodeSecurityGroupIngress]
    Properties:
      LaunchTemplateName: !Sub "EksMngLt-${AWS::StackName}"
      LaunchTemplateData:
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              DeleteOnTermination: true
              VolumeSize: !Ref NodeVolumeSize
              VolumeType: gp3
        InstanceType: !Ref NodeInstanceType
        KeyName: !Ref EksWorkerKeyName
        SecurityGroupIds:
          - !Ref EksNodeSecurityGroup
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                MIME-Version: 1.0
                Content-Type: multipart/mixed; boundary="//"

                --//
                Content-Type: application/node.eks.aws

                ---
                apiVersion: node.eks.aws/v1alpha1
                kind: NodeConfig
                spec:
                  kubelet:
                    flags:
                      - --cpu-manager-policy=static
                    config:
                      nodeLabels:
                        cnf: free5gc

                --//
                Content-Type: text/x-shellscript; charset="us-ascii"

                #!/bin/bash
                set -o xtrace
                # Multus subnets (N2,N3,N4,N6) and the allow-all Multus SG passed in below.
                subnetids="${SubnetIds}"
                secgrpids="${SecGrpIds}"
                IFS=',' read -ra subnetList <<< "$subnetids"
                IFS=',' read -ra secGrpList <<< "$secgrpids"
                subnetListLen=${!#subnetList[@]}
                secGrpListLen=${!#secGrpList[@]}

                # If only one security group is provided, reuse it for every subnet.
                if [ $subnetListLen != $secGrpListLen ]; then
                    x=0
                    for subnet in "${!subnetList[@]}";
                    do
                        secGrpList[${!x}]="${!secGrpList[0]}"
                        x=$((x+1))
                    done
                fi

                ### Get instance ID via IMDSv2
                TOKEN=`curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600"`
                instanceId=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)

                # Create and attach the Multus ENIs (device-index 1..N -> ens6..ensN).
                n=0
                for subnetId in "${!subnetList[@]}";
                do
                    secGrpId="${!secGrpList[n]}"
                    multusId=$(aws ec2 create-network-interface --subnet-id ${!subnetId} \
                    --description "VRF$((n+1))" --groups ${!secGrpId} \
                    --tag-specifications "ResourceType="network-interface",\
                    Tags=[{Key="node.k8s.amazonaws.com/no_manage",Value="true"}]" | jq -r '.NetworkInterface.NetworkInterfaceId');
                    attachmentResult=$(aws ec2 attach-network-interface --network-interface-id ${!multusId} \
                    --instance-id $instanceId \
                    --output text --device-index $((n+1 )) )
                    attachmentId=$(echo "$attachmentResult" | awk '{print $1}')
                    aws ec2 modify-network-interface-attribute --network-interface-id ${!multusId} --no-source-dest-check
                    aws ec2 modify-network-interface-attribute --attachment AttachmentId=${!attachmentId},DeleteOnTermination=True \
                    --network-interface-id ${!multusId}
                    n=$((n+1))
                done

                # Build the GTP5G kernel module for the free5gc UPF.
                # AL2023 kernel 6.12 ships headers as "kernel6.12-devel-$(uname -r)"
                # (NOT the 6.1.x "kernel-devel"). free5gc/upf:v4.2.3 requires gtp5g
                # in the range 0.9.5 <= v < 0.10.0, so pin to tag v0.9.15; the default
                # branch (0.10.x) is rejected by the UPF with "version mismatch".
                KREL="$(uname -r)"
                sudo dnf -y install git make gcc
                sudo dnf -y install "kernel6.12-devel-${!KREL}" || sudo dnf -y install "kernel-devel-${!KREL}" || true
                cd /root
                git clone --branch v0.9.15 --depth 1 https://github.com/free5gc/gtp5g.git && cd gtp5g
                make clean && make
                sudo make install
                sudo depmod -a
                sudo modprobe gtp5g
                printf 'udp_tunnel\ngtp5g\n' | sudo tee /etc/modules-load.d/gtp5g.conf

                # Disable reverse path filtering and bring interfaces up.
                echo "net.ipv4.conf.default.rp_filter = 0" | tee -a /etc/sysctl.conf
                echo "net.ipv4.conf.all.rp_filter = 0" | tee -a /etc/sysctl.conf
                sudo sysctl -p
                ls /sys/class/net/ > /tmp/ethList;cat /tmp/ethList |while read line ; do sudo ip link set $line up; done

                # Set MTU 1500 on the Multus VRF interfaces (ens6-ens10).
                for iface in ens6 ens7 ens8 ens9 ens10; do
                  mkdir -p /etc/systemd/network/70-eks-${!iface}.network.d
                  printf '[Link]\nMTUBytes=1500\n' > /etc/systemd/network/70-eks-${!iface}.network.d/override.conf
                done
                systemctl reload systemd-networkd

                --//
              - SubnetIds: !Join [ ",", [!Ref MultusN2Subnet, !Ref MultusN3Subnet, !Ref MultusN4Subnet, !Ref MultusN6Subnet] ]
                SecGrpIds: !Ref VpcSecurityGroup

  #### Single managed node group hosting free5gc core + packetrusher ####
  EksNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: [EksCluster, EksNodeRole, EksMngLaunchTemplate]
    Properties:
      ClusterName: !Ref EksCluster
      NodeRole: !GetAtt EksNodeRole.Arn
      AmiType: !Ref NodeAmiType
      LaunchTemplate:
        Id: !Ref EksMngLaunchTemplate
      CapacityType: !Ref CapacityType
      ScalingConfig:
        MinSize: !Ref NodeAutoScalingGroupMinSize
        DesiredSize: !Ref NodeAutoScalingGroupDesiredCapacity
        MaxSize: !Ref NodeAutoScalingGroupMaxSize
      Subnets:
        - !Ref PrivK8sSubnetAz1

  #### Access entry so the bastion role can administer the cluster ####
  BastionAccessEntry:
    Type: AWS::EKS::AccessEntry
    DependsOn: [EksCluster]
    Properties:
      ClusterName: !Ref EksCluster
      PrincipalArn: !GetAtt EC2Role.Arn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref Vpc
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"
  BastionPublicIp:
    Description: Bastion host public IP
    Value: !GetAtt BastionInstance.PublicIp
  BastionInstanceId:
    Description: Bastion host instance ID
    Value: !Ref BastionInstance
  EksCluster:
    Description: EKS cluster name
    Value: !Ref EksCluster
    Export:
      Name: !Sub "${AWS::StackName}-EksCluster"
  EksNodeRoleArn:
    Description: EKS node role ARN
    Value: !GetAtt EksNodeRole.Arn
  VpcSecurityGroup:
    Description: VPC-scoped SG used for Multus ENIs
    Value: !Ref VpcSecurityGroup
  MultusN2Subnet:
    Description: N2 Multus subnet
    Value: !Ref MultusN2Subnet
  MultusN3Subnet:
    Description: N3 Multus subnet
    Value: !Ref MultusN3Subnet
  MultusN4Subnet:
    Description: N4 Multus subnet
    Value: !Ref MultusN4Subnet
  MultusN6Subnet:
    Description: N6 Multus subnet
    Value: !Ref MultusN6Subnet
  BastionRoleArn:
    Description: Bastion EC2 role ARN
    Value: !GetAtt EC2Role.Arn
