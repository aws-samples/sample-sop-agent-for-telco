AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ANRA Workshop — Jump host + VPC + ECR.
  EC2 UserData bootstraps: tools, EKS (Terraform), networking fixes, ArgoCD, ANRA deps.

Parameters:
  WorkshopName:
    Type: String
    Default: anra-workshop
  InstanceType:
    Type: String
    Default: m5.xlarge
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:

  # ═══════════ VPC ═══════════
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub '${WorkshopName}-vpc'}]

  IGW:
    Type: AWS::EC2::InternetGateway
  IGWAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref VPC, InternetGatewayId: !Ref IGW}

  PubRT:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref VPC}
  PubRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttach
    Properties: {RouteTableId: !Ref PubRT, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref IGW}

  PubSub1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{Key: 'kubernetes.io/role/elb', Value: '1'}]
  PubSub2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{Key: 'kubernetes.io/role/elb', Value: '1'}]

  NatEIP:
    Type: AWS::EC2::EIP
  NatGW:
    Type: AWS::EC2::NatGateway
    Properties: {AllocationId: !GetAtt NatEIP.AllocationId, SubnetId: !Ref PubSub1}

  PrivRT:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref VPC}
  PrivRoute:
    Type: AWS::EC2::Route
    Properties: {RouteTableId: !Ref PrivRT, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref NatGW}

  PrivSub1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{Key: 'kubernetes.io/role/internal-elb', Value: '1'}]
  PrivSub2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{Key: 'kubernetes.io/role/internal-elb', Value: '1'}]

  PubSub1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PubSub1, RouteTableId: !Ref PubRT}
  PubSub2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PubSub2, RouteTableId: !Ref PubRT}
  PrivSub1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivSub1, RouteTableId: !Ref PrivRT}
  PrivSub2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivSub2, RouteTableId: !Ref PrivRT}

  # ═══════════ IAM ═══════════
  JumpHostRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${WorkshopName}-jumphost
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  JumpHostProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref JumpHostRole]}

  # ═══════════ Security Group ═══════════
  JumpHostSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Jump host - SSM only, no inbound
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # ═══════════ Jump Host ═══════════
  JumpHost:
    Type: AWS::EC2::Instance
    DependsOn: NatGW
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref JumpHostProfile
      SubnetId: !Ref PubSub1
      SecurityGroupIds: [!Ref JumpHostSG]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: {VolumeSize: 50, VolumeType: gp3}
      Tags:
        - Key: Name
          Value: !Sub ${WorkshopName}-jumphost
      UserData:
        Fn::Base64:
          Fn::Join:
            - "\n"
            - - "#!/bin/bash"
              - "exec > /var/log/workshop-bootstrap.log 2>&1"
              - "set -x"
              - ""
              - !Sub "WORKSHOP=${WorkshopName}"
              - !Sub "REGION=${AWS::Region}"
              - !Sub "VPC_ID=${VPC}"
              - !Sub "PRIV_SUB_A=${PrivSub1}"
              - !Sub "PRIV_SUB_B=${PrivSub2}"
              - "HOME=/home/ec2-user"
              - "STATUS=$HOME/.workshop-status"
              - "REPO=https://github.com/aws-samples/sample-sop-agent-for-telco.git"
              - ""
              - "echo BOOTSTRAPPING > $STATUS"
              - ""
              - "# Phase 1: Install tools"
              - "dnf install -y python3.11 python3.11-pip git docker unzip jq"
              - "systemctl enable docker && systemctl start docker"
              - "usermod -aG docker ec2-user"
              - ""
              - "curl -sLO https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
              - "chmod +x kubectl && mv kubectl /usr/local/bin/"
              - ""
              - "curl -s https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash"
              - ""
              - "curl -sLO https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip"
              - "unzip -o terraform_1.9.8_linux_amd64.zip -d /usr/local/bin/ && rm -f terraform_1.9.8_linux_amd64.zip"
              - ""
              - "curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64"
              - "chmod +x /usr/local/bin/argocd"
              - ""
              - "echo TOOLS_INSTALLED > $STATUS"
              - ""
              - "# Phase 2: Clone repo + install deps"
              - "mkdir -p $HOME/environment && cd $HOME/environment"
              - "git clone $REPO workshop"
              - "python3.11 -m pip install -r workshop/requirements.txt"
              - ""
              - "echo REPO_CLONED > $STATUS"
              - ""
              - "# Phase 3: Terraform — EKS cluster"
              - "cd workshop/infra/workshop"
              - "terraform init"
              - "terraform apply -auto-approve -var=cluster_name=$WORKSHOP -var=region=$REGION -var=vpc_id=$VPC_ID -var=\"private_subnets=[\\\"$PRIV_SUB_A\\\",\\\"$PRIV_SUB_B\\\"]\""
              - ""
              - "echo EKS_READY > $STATUS"
              - ""
              - "# Phase 4: Configure kubectl + fix networking"
              - "aws eks update-kubeconfig --name $WORKSHOP --region $REGION --kubeconfig $HOME/.kube/config --alias $WORKSHOP"
              - "export KUBECONFIG=$HOME/.kube/config"
              - ""
              - "# Fix /etc/hosts — VPC resolves EKS endpoint to private IPs"
              - "EKS_HOST=$(aws eks describe-cluster --name $WORKSHOP --region $REGION --query cluster.endpoint --output text | sed 's|https://||')"
              - "EKS_PUB_IP=$(nslookup $EKS_HOST 8.8.8.8 2>/dev/null | grep Address: | tail -1 | awk '{print $2}')"
              - "[ -n \"$EKS_PUB_IP\" ] && echo \"$EKS_PUB_IP $EKS_HOST\" >> /etc/hosts"
              - ""
              - "kubectl get nodes"
              - ""
              - "# Fix node SG — allow ALL intra-node traffic"
              - "NODE_ID=$(kubectl get nodes -o jsonpath='{.items[0].spec.providerID}' | awk -F/ '{print $NF}')"
              - "NODE_SG=$(aws ec2 describe-instances --instance-ids $NODE_ID --region $REGION --query 'Reservations[0].Instances[0].SecurityGroups[0].GroupId' --output text)"
              - "aws ec2 authorize-security-group-ingress --group-id $NODE_SG --protocol all --source-group $NODE_SG --region $REGION 2>/dev/null || true"
              - ""
              - "echo NETWORK_FIXED > $STATUS"
              - ""
              - "# Phase 5: Install ArgoCD"
              - "kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -"
              - "kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml || true"
              - "kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=300s || true"
              - ""
              - "echo ARGOCD_READY > $STATUS"
              - ""
              - "# Phase 6: Create namespaces"
              - "for ns in open5gs srsran anra; do kubectl create namespace $ns --dry-run=client -o yaml | kubectl apply -f -; done"
              - ""
              - "# Phase 7: Setup ec2-user environment"
              - "echo 'export KUBECONFIG=$HOME/.kube/config' >> $HOME/.bashrc"
              - "echo 'export PYTHONPATH=$HOME/environment/workshop/agent' >> $HOME/.bashrc"
              - "echo 'alias sop=\"python3.11 -m agent.sop_executor --fix --yes\"' >> $HOME/.bashrc"
              - "echo 'alias k=kubectl' >> $HOME/.bashrc"
              - "echo 'cd ~/environment/workshop' >> $HOME/.bashrc"
              - ""
              - "chown -R ec2-user:ec2-user $HOME/environment $HOME/.kube $HOME/.bashrc $HOME/.workshop-status"
              - ""
              - "echo COMPLETE > $STATUS"
              - "echo Bootstrap complete!"

  # ═══════════ ECR ═══════════
  ECR:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${WorkshopName}/anra
      ImageTagMutability: MUTABLE
      EmptyOnDelete: true

Outputs:
  JumpHostId:
    Value: !Ref JumpHost
  SSMConnect:
    Value: !Sub aws ssm start-session --target ${JumpHost} --region ${AWS::Region}
  ConsoleSSM:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${JumpHost}?region=${AWS::Region}
  VpcId:
    Value: !Ref VPC
  Region:
    Value: !Ref AWS::Region
