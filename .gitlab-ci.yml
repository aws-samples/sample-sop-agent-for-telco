stages:
  - test

unit-tests:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install --no-cache-dir pytest pytest-mock pytest-asyncio fastapi httpx boto3 requests aiofiles strands-agents strands-agents-builder strands-agents-evals python-docx PyPDF2 pyyaml || true
  script:
    - python -m pytest tests/ -v --tb=short --junitxml=report.xml || [ $? -eq 5 ] && echo "No tests collected — OK"
  artifacts:
    reports:
      junit: report.xml
    when: on_success
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
