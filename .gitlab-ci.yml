stages:
  - test
  - e2e

unit-tests:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install --no-cache-dir pytest pytest-mock pytest-asyncio fastapi httpx boto3 requests aiofiles strands-agents strands-agents-builder strands-agents-evals python-docx PyPDF2 pyyaml || true
  script:
    - python -m pytest tests/ -v --tb=short --junitxml=report.xml || [ $? -eq 5 ] && echo "No tests collected — OK"
  artifacts:
    reports:
      junit: report.xml
    when: on_success
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

e2e-test:
  stage: e2e
  image:
    name: amazon/aws-cli:latest
    entrypoint: ["/bin/sh", "-c"]
  variables:
    INSTANCE_ID: "i-0c3f7845dda89605d"
    AWS_REGION: "ap-northeast-3"
  script:
    - |
      COMMAND_ID=$(aws ssm send-command \
        --instance-ids $INSTANCE_ID \
        --document-name AWS-RunShellScript \
        --region $AWS_REGION \
        --parameters '{"commands":["runuser -u ec2-user -- bash -c \"cd /home/ec2-user/environment/workshop && git fetch origin workshop && git reset --hard origin/workshop && ./tests/e2e.sh --cleanup\""]}' \
        --timeout-seconds 1800 \
        --query Command.CommandId --output text)
      echo "SSM Command: $COMMAND_ID"
      while true; do
        sleep 30
        STATUS=$(aws ssm get-command-invocation --command-id $COMMAND_ID --instance-id $INSTANCE_ID --region $AWS_REGION --query Status --output text 2>/dev/null || echo "Pending")
        echo "Status: $STATUS"
        if [ "$STATUS" = "Success" ]; then
          aws ssm get-command-invocation --command-id $COMMAND_ID --instance-id $INSTANCE_ID --region $AWS_REGION --query StandardOutputContent --output text
          exit 0
        elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
          aws ssm get-command-invocation --command-id $COMMAND_ID --instance-id $INSTANCE_ID --region $AWS_REGION --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id $COMMAND_ID --instance-id $INSTANCE_ID --region $AWS_REGION --query StandardErrorContent --output text >&2
          exit 1
        fi
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: true
