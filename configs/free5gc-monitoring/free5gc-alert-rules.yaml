apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: free5gc-workshop
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: free5gc-workshop
      interval: 15s
      # WORKSHOP TUNING: `for:` windows are deliberately short (30s-2m) and the
      # group evaluates every 15s so a fault injected by a participant surfaces
      # in ANRA within about a minute.
      # Production rules should debounce longer. The `sop` annotation binds the
      # alert to a remediation SOP (path relative to sops/); ANRA reads it via
      # monitor.resolve_sop_reference(). See docs/workshop-v3.md.
      rules:
        - alert: free5gc_nf_unavailable
          # available == 0 catches both a scaled-to-zero Deployment and one whose
          # pod cannot become Ready. (status_replicas_unavailable is desired minus
          # available, so it stays 0 when desired is 0 and misses scale-downs.)
          expr: kube_deployment_status_replicas_available{namespace="free5gc",deployment=~"free5gc-.*"} == 0
          for: 30s
          labels:
            severity: critical
            layer: core
            alarm_key: free5gc_nf_unavailable
          annotations:
            summary: Free5GC network function unavailable
            description: Deployment {{ $labels.deployment }} has unavailable replicas.
            sop: day2-remediate/core/free5gc-nf-unavailable.md

        - alert: free5gc_pod_restarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="free5gc"}[5m]) > 2
          for: 30s
          labels:
            severity: warning
            layer: core
            alarm_key: free5gc_pod_restarting
          annotations:
            summary: Free5GC pod is repeatedly restarting
            description: Pod {{ $labels.pod }} restarted more than twice in five minutes.
            sop: day2-remediate/core/free5gc-pod-crashloop.md


        - alert: free5gc_node_not_ready
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 1m
          labels:
            severity: critical
            layer: infrastructure
            alarm_key: free5gc_node_not_ready
          annotations:
            summary: EKS worker node is not Ready
            description: Node {{ $labels.node }} has not been Ready for one minute.
            sop: day2-remediate/infra/free5gc-node-not-ready.md

        - alert: free5gc_metrics_missing
          # Fires only when the AMF is running but its metric is not scraped (a
          # monitoring gap). When the AMF has no available replica the metric is
          # absent by definition and free5gc_nf_unavailable already reports the
          # outage, so `unless` keeps this rule from raising a second, unrelated
          # alarm (and a Bedrock-drafted SOP) during the AMF incident.
          expr: |
            absent(free5gc_amf_business_ue_gmm_state_count{access_type="3GPP_ACCESS",gmm_state="Registered"})
              unless on() (kube_deployment_status_replicas_available{namespace="free5gc",deployment="free5gc-amf-deployment"} == 0)
          for: 2m
          labels:
            severity: warning
            layer: monitoring
            alarm_key: free5gc_metrics_missing
          annotations:
            summary: Free5GC AMF metrics are missing
            description: Prometheus has not received the AMF registered-UE metric for two minutes while the AMF is running.

        - alert: free5gc_registration_unavailable
          # Two ways to have no registered UE: the AMF reports fewer than one, or
          # the AMF has no available replica (its metric is then absent). A
          # running AMF that has not been scraped yet matches neither branch, so
          # a fresh Prometheus does not raise a false alarm before its first AMF
          # scrape. metrics_missing covers a lasting scrape gap on a running AMF.
          expr: |
            (sum(free5gc_amf_business_ue_gmm_state_count{access_type="3GPP_ACCESS",gmm_state="Registered"}) < 1)
              or on() (sum(kube_deployment_status_replicas_available{namespace="free5gc",deployment="free5gc-amf-deployment"}) == 0)
          for: 30s
          labels:
            severity: critical
            layer: core
            alarm_key: free5gc_registration_unavailable
          annotations:
            summary: No UE is connected to the Free5GC AMF
            description: The workshop baseline expects at least one connected PacketRusher UE.
            sop: day2-remediate/core/free5gc-registration-unavailable.md
