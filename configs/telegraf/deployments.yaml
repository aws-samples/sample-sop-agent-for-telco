# Telegraf deployments (RAN / Core / HW collectors).
#
# IMPORTANT — credential contract:
#   - INFLUX_TOKEN is sourced from a Secret named `telegraf-influx` (key: token).
#   - BMC_USER / BMC_PASS (telegraf-hw only) are sourced from a Secret named
#     `telegraf-hw-bmc` (keys: username, password).
#
# These Secrets are NOT created by anything currently in this package;
# operators must create them out-of-band (kubectl apply, External Secrets
# Operator, AWS Secrets Manager + CSI driver, or whatever fits the cluster's
# secret-management story) before applying this manifest. A helm chart that
# templates them from chart values is planned as a follow-up port from
# upstream telco-ops; until that lands, `kubectl apply -f deployments.yaml`
# will fail with `secret "..." not found` if the Secrets are absent.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf-ran
  labels:
    app: telegraf-ran
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegraf-ran
  template:
    metadata:
      labels:
        app: telegraf-ran
    spec:
      containers:
      - name: telegraf
        image: telegraf:1.31
        env:
        - name: INFLUX_TOKEN
          valueFrom:
            secretKeyRef:
              name: telegraf-influx
              key: token
        volumeMounts:
        - name: config
          mountPath: /etc/telegraf/telegraf.conf
          subPath: telegraf-ran.conf
        - name: config
          mountPath: /etc/telegraf/ws_adapter.py
          subPath: ws_adapter.py
      volumes:
      - name: config
        configMap:
          name: telegraf-ran-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf-core
  labels:
    app: telegraf-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegraf-core
  template:
    metadata:
      labels:
        app: telegraf-core
    spec:
      containers:
      - name: telegraf
        image: telegraf:1.31
        env:
        - name: INFLUX_TOKEN
          valueFrom:
            secretKeyRef:
              name: telegraf-influx
              key: token
        - name: OPEN5GS_METRICS_URL
          value: "http://open5gs-metrics.open5gs.svc:9090/metrics"
        volumeMounts:
        - name: config
          mountPath: /etc/telegraf/telegraf.conf
          subPath: telegraf-core.conf
        - name: config
          mountPath: /etc/telegraf/core_collector.py
          subPath: core_collector.py
      volumes:
      - name: config
        configMap:
          name: telegraf-core-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf-hw
  labels:
    app: telegraf-hw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telegraf-hw
  template:
    metadata:
      labels:
        app: telegraf-hw
    spec:
      containers:
      - name: telegraf
        image: telegraf:1.31
        env:
        - name: INFLUX_TOKEN
          valueFrom:
            secretKeyRef:
              name: telegraf-influx
              key: token
        - name: BMC_ADDRESS
          value: "https://GNB_HOST_IP"
        - name: BMC_USER
          valueFrom:
            secretKeyRef:
              name: telegraf-hw-bmc
              key: username
        - name: BMC_PASS
          valueFrom:
            secretKeyRef:
              name: telegraf-hw-bmc
              key: password
        volumeMounts:
        - name: config
          mountPath: /etc/telegraf/telegraf.conf
          subPath: telegraf-hw.conf
      volumes:
      - name: config
        configMap:
          name: telegraf-hw-config
