[agent]
  interval = "15s"
  flush_interval = "15s"

[[inputs.execd]]
  command = ["python3", "/etc/telegraf/core_collector.py"]
  signal = "none"
  restart_delay = "10s"
  data_format = "json"
  name_override = "open5gs"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb.anra.svc:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "srs"
  bucket = "srsran"
