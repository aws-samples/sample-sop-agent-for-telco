# ANO Platform — Umbrella chart for full Day 0/1/2 autonomous operations
#
# Enable/disable individual agents based on your deployment stage.
# For production, deploy each agent independently to its target cluster.
# This umbrella is ideal for PoC, demo, or single-cluster dev environments.

# --- Agent toggles ---
# Workshop-v3 uses CloudFormation for Day-0 infrastructure, so ANPA is off.
anpa:
  enabled: false
anda:
  enabled: true
anra:
  enabled: true

# --- Global overrides (passed to all sub-charts) ---
global:
  image:
    registry: ""  # Override ECR registry for all agents
  aws:
    region: us-west-2

