{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "anpa.fullname" . }}
  labels:
    {{- include "anpa.labels" . | nindent 4 }}
rules:
  # Cross-agent: create DeploymentPlan CRs to trigger ANDA after provisioning
  - apiGroups: ["deployment.anda.aws.io"]
    resources: ["deploymentplans"]
    verbs: ["get", "list", "watch", "create", "patch"]

  # Topology CRDs (read/write)
  - apiGroups: ["topology.anra.aws.io"]
    resources: ["sites", "sites/status", "clusters", "clusters/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Provisioning CRDs
  - apiGroups: ["provisioning.anpa.aws.io"]
    resources: ["hardwareinventories", "hardwareinventories/status", "provisioningrequests", "provisioningrequests/status", "osimages"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Tinkerbell resources
  - apiGroups: ["tinkerbell.org"]
    resources: ["hardware", "templates", "workflows"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Node management
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "anpa.fullname" . }}
  labels:
    {{- include "anpa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "anpa.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "anpa.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anpa.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "anpa.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anpa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "anpa.fullname" . }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
