{{- /*
BMC credentials Secret.

Only generated when bmc.existingSecret is empty. Otherwise the deployment
references the existing Secret directly via secretKeyRef.

Backward-compat: falls through to .Values.secrets.* if the new bmc.* keys
are unset.
*/ -}}
{{- if and .Values.bmc.enabled (not .Values.bmc.existingSecret) }}
{{- /* Fail fast: an empty generated Secret silently passes Helm but breaks the
       reconciler at runtime. Require explicit creds, or point at an existing
       Secret via bmc.existingSecret. */ -}}
{{- $bmcUsername := (.Values.bmc.username | default .Values.secrets.bmcUsername) | required "anpa: set bmc.username (or bmc.existingSecret) when bmc.enabled=true" -}}
{{- $bmcPassword := (.Values.bmc.password | default .Values.secrets.bmcPassword) | required "anpa: set bmc.password (or bmc.existingSecret) when bmc.enabled=true" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anpa.fullname" . }}-secrets
  labels:
    {{- include "anpa.labels" . | nindent 4 }}
type: Opaque
data:
  bmc-username: {{ $bmcUsername | b64enc | quote }}
  bmc-password: {{ $bmcPassword | b64enc | quote }}
  ssh-public-key: {{ (.Values.bmc.sshPublicKey | default .Values.secrets.sshPublicKey) | b64enc | quote }}
{{- end }}
