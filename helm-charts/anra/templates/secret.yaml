{{- /*
ANRA credentials Secret.

Only generated when credentials.existingSecret is empty. Otherwise the
deployment references the pre-created Secret directly.

For production: create Secret out-of-band (never commit real tokens):
  kubectl create secret generic anra-credentials -n anra-system \
    --from-literal=auth-username=admin \
    --from-literal=auth-password='<password>' \
    --from-literal=influxdb-token='<token>' \
    --from-literal=bmc-password='<password>'
Then set: credentials.existingSecret: anra-credentials
*/ -}}
{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anra.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anra.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth-username: {{ .Values.auth.username | default "admin" | quote }}
  auth-password: {{ .Values.auth.password | default "" | quote }}
  influxdb-token: {{ .Values.secrets.influxdbToken | default "" | quote }}
  {{- if .Values.secrets.bmcPassword }}
  bmc-password: {{ .Values.secrets.bmcPassword | quote }}
  {{- end }}
{{- end }}
