# Credentials — create Secret out-of-band for production:
#   kubectl create secret generic anra-credentials -n anra-system \
#     --from-literal=auth-username=admin \
#     --from-literal=auth-password='<password>' \
#     --from-literal=influxdb-token='<token>' \
#     --from-literal=bmc-password='<password>'
# Then set: credentials.existingSecret: anra-credentials
credentials:
  existingSecret: ""  # if set, uses this Secret instead of generating one

# Inline secrets (dev only — NEVER commit real tokens. Use existingSecret for production)
secrets:
  influxdbToken: ""
  bmcPassword: ""

# External monitoring (URLs only — deploy separately via configs/)
# Monitoring data sources — defaults resolve via K8s DNS when co-deployed in same namespace
monitoring:
  # In-cluster InfluxDB (deployed by `make monitoring` / `make demo`)
  influxdbUrl: "http://influxdb.anra.svc:8086"
  influxdbOrg: srs
  influxdbBucket: srsran
  # Alertmanager (deployed by `make monitoring` if available)
  alertmanagerUrl: "http://alertmanager.anra.svc:9093"

# Dashboard
webui:
  enabled: true
  port: 8080
  service:
    type: NodePort
    nodePort: 30080

# Optional AWS ALB Ingress (AWS Load Balancer Controller) — use as origin for Amazon CloudFront.
# When enabled, switch webui.service.type to ClusterIP unless you need NodePort for other access.
ingress:
  enabled: false
  # Must match the IngressClass installed by AWS Load Balancer Controller (commonly "alb")
  className: alb
  # Optional. If empty, a single default rule (ALB DNS only) is used.
  host: ""
  # Extra ALB annotations (e.g. certificate-arn, listen-ports) — see docs/CLOUDFRONT.md
  annotations: {}

ssm:
  region: us-west-1

# HTTP Basic Auth (optional)
auth:
  username: admin
  password: ""

# --- Self-Update (Edge Autonomy) ---
# ANRA pulls its own updates from ECR — no dependency on management cluster.
# Operates independently during network partitions.
selfUpdate:
  enabled: true
  schedule: "0 */4 * * *"  # Check every 4 hours
  # ECR registry to poll for new image tags
  registry:
    # Defaults to image.repository if empty
    repository: ""
    # Semantic version constraint (e.g. ">=0.2.0 <1.0.0")
    # "latest" always pulls newest; pin for production
    versionConstraint: ">=0.2.0"
  # Maintenance window — only apply updates within this window
  maintenanceWindow:
    enabled: true
    # Cron expression for allowed update times (UTC)
    # Default: Tuesday/Thursday 02:00-06:00 UTC
    start: "0 2 * * 2,4"
    durationMinutes: 240
  # Safety controls
  safety:
    # Run health check before restarting with new image
    preUpdateHealthCheck: true
    # Automatically rollback if new version fails health check
    autoRollback: true
    # Seconds to wait for new pod to become ready
    readinessTimeout: 120
    # Keep N previous image tags for rollback
    rollbackHistory: 3
  # Disconnected mode behavior
  disconnected:
    # Continue operating with current version if ECR unreachable
    continueOnFailure: true
    # Queue telemetry/status for later sync
    bufferEvents: true
    # Max events to buffer before dropping oldest
    bufferSize: 10000
