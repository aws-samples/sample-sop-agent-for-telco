# ===========================================================================
# EXAMPLE values for site-002-workload deployment
# ===========================================================================
# IMPORTANT: Copy this file and replace all <PLACEHOLDER> values before use.
# NEVER commit actual credentials — use Kubernetes Secrets or external secrets.
# ===========================================================================
image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/anra
  tag: latest
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/AnraRole
bedrock:
  region: us-west-2
  profile: ""
auth:
  username: admin
  password: <CHANGE_ME>
approval:
  mode: auto
remediation:
  mode: gitops
  argocd_url: http://argocd-server.argocd.svc:80
config:
  cluster:
    name: site-002-workload
    context: site-002-workload
    region: us-west-1
  nodes:
  - name: dell-worker-1
    oam_ip: 192.168.31.195
    ssm_id: <SSM_MANAGED_INSTANCE_ID>
    bmc:
      ip: 192.168.30.10
      type: idrac
      username: root
      password_secret: bmc-creds
    roles:
    - upf
    namespaces:
    - open5gs
  - name: dell-worker-2
    oam_ip: 192.168.31.222
    ssm_id: <SSM_MANAGED_INSTANCE_ID>
    bmc:
      ip: 192.168.30.11
      type: idrac
      username: root
      password_secret: bmc-creds
    roles:
    - du
    - cu
    namespaces:
    - srsran
  topology:
    provider: yaml
  alarms:
  - name: du_cpu_overload
    layer: 3
    source: ran
    field: du_du_high_mac_dl_0_cpu_usage_percent
    condition: '> 80'
    severity: critical
    depends_on: []
    nf_scope: per-node
    sop: day2-remediate/ran/remediate-du-cpu-overload.md
    service_impact: DL/UL throughput degradation
    probable_cause: CPU contention, insufficient isolation
    alarm_id: du-cpu-overload-001
    alarm_type: processing-error-alarm
    probable_cause_code: 13
    perceived_severity: critical
    managed_object_class: GNBDUFunction
    specific_problem: DU MAC CPU usage exceeded threshold
  - name: du_timing_failure
    layer: 3
    source: ran
    field: cells_0_cell_metrics_error_indication_count
    condition: '> 500'
    severity: critical
    depends_on:
    - amf_gnb_disconnect
    - ptp_drift
    nf_scope: per-node
    sop: day2-remediate/ran/remediate-du-timing-failure.md
    service_impact: Cell outage, UE disconnections
    probable_cause: PTP drift, NIC timestamping, FAPI errors
    alarm_id: du-timing-failure-001
    alarm_type: communications-alarm
    probable_cause_code: 60
    perceived_severity: critical
    managed_object_class: GNBDUFunction
    specific_problem: Error indication count exceeded threshold
  - name: du_throughput_drop
    layer: 3
    source: ran
    field: cells_0_ue_list_0_dl_brate
    condition: < 500000
    severity: warning
    depends_on:
    - du_timing_failure
    - amf_gnb_disconnect
    nf_scope: per-node
    service_impact: Reduced user throughput
    probable_cause: CPU overload, interference, channel degradation
    alarm_id: du-throughput-drop-001
    alarm_type: quality-of-service-alarm
    probable_cause_code: 42
    perceived_severity: major
    managed_object_class: GNBDUFunction
    specific_problem: DL throughput below minimum threshold
  - name: amf_gnb_disconnect
    layer: 2
    source: core
    field: amf_gnb
    condition: < 1
    severity: critical
    depends_on:
    - nf_crashloop
    - network_partition
    nf_scope: per-instance
    sop: day2-remediate/core/remediate-amf-gnb-disconnect.md
    service_impact: gNB isolated, all UEs lose service
    probable_cause: SCTP failure, AMF crash, network partition
    alarm_id: amf-gnb-disconnect-001
    alarm_type: communications-alarm
    probable_cause_code: 9
    perceived_severity: critical
    managed_object_class: AMFFunction
    specific_problem: gNB SCTP association lost
  - name: amf_registration_failure
    layer: 2
    source: core
    field: amf_fivegs_amffunction_rm_reginitfail
    condition: '> 0'
    severity: critical
    depends_on:
    - nf_crashloop
    nf_scope: per-instance
    service_impact: UEs cannot register
    probable_cause: Auth chain broken (AUSF/UDM/UDR/MongoDB)
    alarm_id: amf-registration-failure-001
    alarm_type: communications-alarm
    probable_cause_code: 7
    perceived_severity: critical
    managed_object_class: AMFFunction
    specific_problem: UE registration failures detected
  - name: amf_auth_rejection
    layer: 2
    source: core
    field: amf_fivegs_amffunction_amf_authreject
    condition: '> 0'
    severity: critical
    depends_on:
    - nf_crashloop
    nf_scope: per-instance
    service_impact: Authentication failing
    probable_cause: Subscriber credentials mismatch
    alarm_id: amf-auth-rejection-001
    alarm_type: communications-alarm
    probable_cause_code: 7
    perceived_severity: critical
    managed_object_class: AMFFunction
    specific_problem: Authentication rejections detected
  - name: smf_pfcp_failure
    layer: 2
    source: core
    field: smf_fivegs_smffunction_sm_n4sessionestabfail
    condition: '> 0'
    severity: critical
    depends_on:
    - network_partition
    nf_scope: per-instance
    sop: day2-remediate/core/remediate-upf-pfcp-loss.md
    service_impact: Cannot establish PDU sessions
    probable_cause: UPF unreachable, cross-CNI routing
    alarm_id: smf-pfcp-failure-001
    alarm_type: communications-alarm
    probable_cause_code: 8
    perceived_severity: critical
    managed_object_class: SMFFunction
    specific_problem: PFCP session establishment failures
  - name: upf_no_traffic
    layer: 2
    source: core
    field: upf_fivegs_ep_n3_gtp_indatapktn3upf
    condition: == 0
    severity: warning
    depends_on:
    - amf_gnb_disconnect
    - smf_pfcp_failure
    nf_scope: per-instance
    service_impact: No user plane traffic
    probable_cause: No PDU sessions, UPF routing broken
    alarm_id: upf-no-traffic-001
    alarm_type: quality-of-service-alarm
    probable_cause_code: 42
    perceived_severity: major
    managed_object_class: UPFFunction
    specific_problem: No user plane traffic detected
  - name: sbi_mesh_failure
    layer: 2
    source: core
    field: alarm_scp_timeout
    condition: '> 0'
    severity: critical
    depends_on:
    - nf_crashloop
    nf_scope: site-wide
    service_impact: NF-to-NF communication broken
    probable_cause: SCP down, DNS failure
    alarm_id: sbi-mesh-failure-001
    alarm_type: communications-alarm
    probable_cause_code: 9
    perceived_severity: critical
    managed_object_class: ManagedElement
    specific_problem: SBI mesh communication timeout
  - name: nf_crashloop
    layer: 2
    source: core
    field: core_nf_health_pct
    condition: < 95
    severity: critical
    depends_on:
    - network_partition
    nf_scope: per-instance
    sop: day2-remediate/core/remediate-nf-crashloop.md
    service_impact: Degraded core network
    probable_cause: OOM, config error, dependency unavailable
    alarm_id: nf-crashloop-001
    alarm_type: processing-error-alarm
    probable_cause_code: 54
    perceived_severity: critical
    managed_object_class: ManagedElement
    specific_problem: NF health below threshold
  - name: network_partition
    layer: 1
    source: core
    field: node_not_ready
    condition: '> 0'
    severity: critical
    depends_on: []
    nf_scope: site-wide
    sop: day2-remediate/infra/remediate-network-partition.md
    service_impact: RAN isolated from core
    probable_cause: VPN tunnel down, routing change
    alarm_id: network-partition-001
    alarm_type: communications-alarm
    probable_cause_code: 34
    perceived_severity: critical
    managed_object_class: ManagedElement
    specific_problem: Network connectivity lost between nodes
  - name: ptp_drift
    layer: 1
    source: ran
    field: ptp_offset_ns
    condition: '> 1500'
    severity: critical
    depends_on: []
    nf_scope: per-node
    sop: day2-remediate/infra/remediate-ptp-drift.md
    service_impact: TDD scheduling failure
    probable_cause: Grandmaster unreachable
    alarm_id: ptp-drift-001
    alarm_type: communications-alarm
    probable_cause_code: 60
    perceived_severity: critical
    managed_object_class: ManagedElement
    specific_problem: PTP clock offset exceeded threshold
  - name: memory_pressure
    layer: 1
    source: os
    field: node_pressure_memory_stalled_seconds_total
    condition: '> 10'
    severity: critical
    depends_on: []
    nf_scope: per-node
    service_impact: Pod evictions, OOM kills
    probable_cause: Memory leak, overcommit
    alarm_id: memory-pressure-001
    alarm_type: processing-error-alarm
    probable_cause_code: 39
    perceived_severity: major
    managed_object_class: ManagedElement
    specific_problem: Memory pressure detected on node
  - name: high_cpu_steal
    layer: 1
    source: os
    field: node_cpu_steal_percent
    condition: '> 5'
    severity: warning
    depends_on: []
    nf_scope: per-node
    service_impact: Latency increase
    probable_cause: Noisy neighbor on shared host
    alarm_id: high-cpu-steal-001
    alarm_type: processing-error-alarm
    probable_cause_code: 13
    perceived_severity: minor
    managed_object_class: ManagedElement
    specific_problem: CPU steal time indicates noisy neighbor
  anomaly_detection:
    enabled: true
    baseline_samples: 10
    sigma_threshold: 3
    max_sops_per_hour: 3
    testmode: true
  guardrails:
    protected_namespaces:
    - srsran
    - open5gs
    - anra
    - kube-system
    blocked_commands:
    - scale.*--replicas.*0
    - delete deployment
    - delete statefulset
    - delete namespace
    approval_mode: auto
secrets:
  influxdbToken: <INFLUXDB_TOKEN>
  bmcPassword: <BMC_PASSWORD>
monitoring:
  influxdbUrl: http://influxdb.anra.svc.cluster.local:8086
  influxdbOrg: srs
  influxdbBucket: srsran
influxdb:
  enabled: true
telegraf:
  ran:
    enabled: true
    gnbHost: 192.168.31.222
    gnbPort: 55555
  core:
    enabled: true
    coreNamespace: open5gs
  hw:
    enabled: true
    bmcTargets:
    - ip: 192.168.30.10
      username: root
    - ip: 192.168.30.11
      username: root
alertmanager:
  enabled: false
webui:
  service:
    type: NodePort
    nodePort: 30080
ssm:
  region: us-west-1
