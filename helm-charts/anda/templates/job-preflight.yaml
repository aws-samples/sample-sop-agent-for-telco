{{- if .Values.validation.preflight.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "anda.fullname" . }}-preflight
  labels:
    {{- include "anda.labels" . | nindent 4 }}
    app.kubernetes.io/component: preflight
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "anda.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: preflight
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: preflight
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["python", "-m", "anda.preflight"]
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}
            - name: VALIDATION_CHECKS
              value: {{ join "," .Values.validation.preflight.checks | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
