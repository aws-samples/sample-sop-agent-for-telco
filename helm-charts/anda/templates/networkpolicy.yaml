{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "anda.fullname" . }}
  labels:
    {{- include "anda.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "anda.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # Allow DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS egress (Bedrock, ECR, SSM, K8s API — all regional endpoints).
    # Default 0.0.0.0/0: AWS service IPs are not predictable (use prefix lists).
    # PRODUCTION: set .Values.networkPolicy.egressCIDR to your VPC CIDR or
    # NAT Gateway IP to restrict outbound to known AWS endpoints only.
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.egressCIDR | default "0.0.0.0/0" }}
      ports:
        - protocol: TCP
          port: 443
    # Allow ArgoCD server
    {{- if .Values.argocd.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.argocd.namespace }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
{{- end }}
