{{- /*
ANDA credentials Secret.

Only generated when credentials.existingSecret is empty.
For production: create Secret out-of-band:
  kubectl create secret generic anda-credentials -n anda-system \
    --from-literal=git-token='<token>'
Then set: credentials.existingSecret: anda-credentials
*/ -}}
{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anda.fullname" . }}-secrets
  labels:
    {{- include "anda.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.gitToken }}
  git-token: {{ .Values.secrets.gitToken | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.registryCredentials }}
  registry-credentials: {{ .Values.secrets.registryCredentials | b64enc | quote }}
  {{- end }}
{{- end }}
