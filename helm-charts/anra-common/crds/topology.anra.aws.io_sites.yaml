apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sites.topology.anra.aws.io
  labels:
    app.kubernetes.io/part-of: anra-platform
spec:
  group: topology.anra.aws.io
  names:
    kind: Site
    listKind: SiteList
    plural: sites
    singular: site
    shortNames: [site]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [name, region]
              properties:
                name:
                  type: string
                  description: Human-readable site identifier (e.g. site-002)
                region:
                  type: string
                  description: AWS region for control plane connectivity
                location:
                  type: object
                  properties:
                    address:
                      type: string
                    latitude:
                      type: string
                    longitude:
                      type: string
                hardware:
                  type: array
                  items:
                    type: object
                    properties:
                      hostname:
                        type: string
                      bmcAddress:
                        type: string
                      role:
                        type: string
                        enum: [control-plane, worker, ran, core]
                      hardwareProfile:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Provisioning, Ready, Degraded, Failed]
                clusters:
                  type: array
                  items:
                    type: string
                lastReconciled:
                  type: string
                  format: date-time
      additionalPrinterColumns:
        - name: Region
          type: string
          jsonPath: .spec.region
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
