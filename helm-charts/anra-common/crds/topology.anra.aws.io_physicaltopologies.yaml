apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: physicaltopologies.topology.anra.aws.io
  labels:
    app.kubernetes.io/part-of: ano-platform
spec:
  group: topology.anra.aws.io
  names:
    kind: PhysicalTopology
    listKind: PhysicalTopologyList
    plural: physicaltopologies
    singular: physicaltopology
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                site:
                  type: object
                  properties:
                    name:
                      type: string
                    region:
                      type: string
                racks:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      servers:
                        type: array
                        items:
                          type: object
                          required: [name]
                          properties:
                            name:
                              type: string
                            bmc:
                              type: string
                            roles:
                              type: array
                              items:
                                type: string
                            status:
                              type: string
                              enum: [healthy, degraded, offline]
                            nics:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                  mac:
                                    type: string
                                  speed:
                                    type: string
                            connections:
                              type: array
                              items:
                                type: object
                                properties:
                                  peer:
                                    type: string
                                  discovered_via:
                                    type: string
                                  bandwidth:
                                    type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Ready, Error]
      additionalPrinterColumns:
        - name: Site
          type: string
          jsonPath: .spec.site.name
        - name: Region
          type: string
          jsonPath: .spec.site.region
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
