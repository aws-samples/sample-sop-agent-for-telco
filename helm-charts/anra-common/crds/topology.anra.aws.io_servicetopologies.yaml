apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: servicetopologies.topology.anra.aws.io
  labels:
    app.kubernetes.io/part-of: anra-platform
spec:
  group: topology.anra.aws.io
  names:
    kind: ServiceTopology
    listKind: ServiceTopologyList
    plural: servicetopologies
    singular: servicetopology
    shortNames: [stopo]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [siteName, networkFunctions]
              properties:
                siteName:
                  type: string
                  description: Reference to the Site CR this topology describes
                description:
                  type: string
                networkFunctions:
                  type: array
                  description: Network functions deployed at this site
                  items:
                    type: object
                    required: [name, type]
                    properties:
                      name:
                        type: string
                        description: Unique identifier for this NF instance
                      type:
                        type: string
                        description: 3GPP NF type
                        enum:
                          - AMF
                          - SMF
                          - UPF
                          - NRF
                          - NSSF
                          - AUSF
                          - UDM
                          - UDR
                          - PCF
                          - BSF
                          - SCP
                          - gNB-CU
                          - gNB-DU
                          - gNB
                          - UE
                          - Monitoring
                          - Platform
                      layer:
                        type: string
                        description: Functional layer
                        enum: [ran, core, transport, platform, monitoring]
                      namespace:
                        type: string
                        description: Kubernetes namespace where this NF runs
                      deployment:
                        type: string
                        description: Name of the Deployment/StatefulSet
                      helm:
                        type: object
                        properties:
                          chart:
                            type: string
                          release:
                            type: string
                          values:
                            type: string
                            description: ConfigMap/Secret name containing values override
                      interfaces:
                        type: array
                        description: 3GPP reference points this NF exposes
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: "Interface name (e.g. N1, N2, N3, N4, N6, Xn, F1)"
                            protocol:
                              type: string
                              enum: [SCTP, GTP-U, PFCP, HTTP2, SBI, UDP, TCP, IP]
                            port:
                              type: integer
                            peer:
                              type: string
                              description: Name of the NF at the other end of this interface
                      dependsOn:
                        type: array
                        description: NF names this function depends on (service-level)
                        items:
                          type: string
                      runsOn:
                        type: string
                        description: Reference to hardware node name (from Site CR)
                      criticality:
                        type: string
                        enum: [critical, major, minor]
                        description: Impact severity if this NF fails
                links:
                  type: array
                  description: Explicit service-level connections between NFs
                  items:
                    type: object
                    required: [from, to, interface]
                    properties:
                      from:
                        type: string
                      to:
                        type: string
                      interface:
                        type: string
                        description: "3GPP reference point (e.g. N2, N4, N3)"
                      protocol:
                        type: string
                      dataPlane:
                        type: boolean
                        description: Whether this carries user-plane traffic
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Valid, Degraded, Error]
                nfCount:
                  type: integer
                  description: Number of network functions in the topology
                impactMapVersion:
                  type: string
                  description: Hash of the last computed ImpactMap
                lastReconciled:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      additionalPrinterColumns:
        - name: Site
          type: string
          jsonPath: .spec.siteName
        - name: NFs
          type: integer
          jsonPath: .status.nfCount
          description: Number of network functions
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
