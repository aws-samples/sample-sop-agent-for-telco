apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusters.topology.anra.aws.io
  labels:
    app.kubernetes.io/part-of: anra-platform
spec:
  group: topology.anra.aws.io
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    singular: cluster
    shortNames: [cl]
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [name, site, region]
              properties:
                name:
                  type: string
                  description: EKS cluster name
                site:
                  type: string
                  description: Reference to parent Site CR name
                region:
                  type: string
                role:
                  type: string
                  enum: [management, workload]
                  default: workload
                kubernetesVersion:
                  type: string
                nodes:
                  type: array
                  items:
                    type: object
                    properties:
                      hostname:
                        type: string
                      role:
                        type: string
                      status:
                        type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Creating, Active, Upgrading, Degraded, Deleting]
                nodeCount:
                  type: integer
                readyNodes:
                  type: integer
                networkFunctions:
                  type: array
                  items:
                    type: string
                lastReconciled:
                  type: string
                  format: date-time
      additionalPrinterColumns:
        - name: Site
          type: string
          jsonPath: .spec.site
        - name: Role
          type: string
          jsonPath: .spec.role
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Nodes
          type: integer
          jsonPath: .status.nodeCount
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
