name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=report.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: report.xml

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install ruff mypy boto3-stubs types-requests

      - name: Ruff lint
        run: ruff check agent/ evals/ tests/ --output-format=github

      - name: Ruff format check
        run: ruff format --check agent/ evals/ tests/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install bandit semgrep

      - name: Bandit security scan
        run: |
          bandit -r agent/ evals/ \
            -s B602,B603,B404 \
            --severity-level high \
            --confidence-level high \
            --format json -o bandit-report.json || true
          bandit -r agent/ evals/ \
            -s B602,B603,B404 \
            --severity-level high \
            --confidence-level high

      - name: Semgrep scan
        run: semgrep scan --config auto --error agent/ evals/

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
