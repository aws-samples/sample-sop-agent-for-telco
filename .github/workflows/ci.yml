name: CI

on:
  push:
    branches: [main, dev, workshop, workshop-bulletproof, "wsbp/**"]
  pull_request:
    branches: [main, dev, workshop-bulletproof, workshop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (core)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --ignore=tests/test_steering.py --ignore=tests/test_sop_graph.py

  code-quality:
    name: Code quality (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check agent/ tests/ --output-format=github

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install bandit

      - name: Bandit
        run: bandit -r agent/ -s B602,B603,B404 --severity-level high --confidence-level high

  helm-validate:
    name: Helm validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Helm lint
        run: helm lint helm/anra/

      - name: Helm template
        run: helm template test helm/anra/ --set image.repository=anra --set image.tag=ci > /dev/null

  publish-workshop-image:
    name: Publish workshop image
    runs-on: ubuntu-latest
    needs: [unit-tests, code-quality, security, helm-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/workshop'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Public ECR
        run: |
          aws ecr-public get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin public.ecr.aws

      - name: Build and push
        run: |
          SHA=$(git rev-parse --short HEAD)
          docker build -t public.ecr.aws/t2j9i5y9/anra-workshop:latest \
                       -t public.ecr.aws/t2j9i5y9/anra-workshop:$SHA .
          docker push public.ecr.aws/t2j9i5y9/anra-workshop:latest
          docker push public.ecr.aws/t2j9i5y9/anra-workshop:$SHA
          echo "### 🚀 Workshop image published" >> $GITHUB_STEP_SUMMARY
          echo "- **latest** + **$SHA**" >> $GITHUB_STEP_SUMMARY
          echo "- \`public.ecr.aws/t2j9i5y9/anra-workshop:latest\`" >> $GITHUB_STEP_SUMMARY
