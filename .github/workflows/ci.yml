name: CI

on:
  push:
    branches: [main, dev, workshop-bulletproof, "wsbp/**"]
  pull_request:
    branches: [main, dev, workshop-bulletproof, workshop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (core)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --junitxml=report.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-core-${{ matrix.python-version }}
          path: report.xml

  code-quality:
    name: Code quality (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check agent/ tests/ --output-format=github

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install security tools
        run: pip install bandit

      - name: Bandit
        run: |
          bandit -r agent/ -s B602,B603,B404 \
            --severity-level high --confidence-level high

  docker-build-eks:
    name: Docker build (EKS image)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: hashFiles('Dockerfile') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: anra:ci
          cache-from: type=gha,scope=eks
          cache-to: type=gha,mode=max,scope=eks

  helm-validate:
    name: Helm validate
    runs-on: ubuntu-latest
    if: hashFiles('helm/anra/Chart.yaml') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Helm lint
        run: helm lint helm/anra/

      - name: Helm template (default values)
        run: helm template test helm/anra/ --set image.repository=anra --set image.tag=ci --debug > /dev/null
