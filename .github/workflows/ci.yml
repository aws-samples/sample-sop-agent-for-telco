name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_PUBLIC_URI: public.ecr.aws/k6b9y4d0/sample-sop-agent-for-telco
  EKS_CLUSTER: sop-agent-test
  NAMESPACE: sop-agent
  IAM_ROLE: arn:aws:iam::833185305196:role/github-actions-sop-agent

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=report.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: report.xml

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install ruff mypy boto3-stubs types-requests

      - name: Ruff lint
        run: ruff check agent/ evals/ tests/ --output-format=github

      - name: Ruff format check
        run: ruff format --check agent/ evals/ tests/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install bandit semgrep

      - name: Bandit security scan
        run: |
          bandit -r agent/ evals/ \
            -s B602,B603,B404 \
            --severity-level high \
            --confidence-level high \
            --format json -o bandit-report.json || true
          bandit -r agent/ evals/ \
            -s B602,B603,B404 \
            --severity-level high \
            --confidence-level high

      - name: Semgrep scan
        run: semgrep scan --config auto --error agent/ evals/

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  # ── Build & Push to Public ECR ──
  # Runs on PRs (for validation) and on tags (for release)
  build-and-push:
    runs-on: ubuntu-latest
    needs: [unit-tests, code-quality, security]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
      image-uri: ${{ steps.meta.outputs.uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE }}
          aws-region: us-east-1

      - name: Login to Public ECR
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - name: Docker metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="pr-${{ github.event.pull_request.number }}-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "uri=${{ env.ECR_PUBLIC_URI }}:${TAG}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t ${{ env.ECR_PUBLIC_URI }}:${{ steps.meta.outputs.tag }} .
          docker tag ${{ env.ECR_PUBLIC_URI }}:${{ steps.meta.outputs.tag }} ${{ env.ECR_PUBLIC_URI }}:latest

      - name: Push Docker image
        run: |
          docker push ${{ env.ECR_PUBLIC_URI }}:${{ steps.meta.outputs.tag }}
          # Push :latest only on tags (releases)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            docker push ${{ env.ECR_PUBLIC_URI }}:latest
          fi

      - name: Summary
        run: |
          echo "### 🐳 Image Published" >> $GITHUB_STEP_SUMMARY
          echo "- **URI:** \`${{ steps.meta.outputs.uri }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${{ steps.meta.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY

  # ── End-to-End Tests on EKS ──
  e2e-test:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Verify secrets are configured
        run: |
          if [[ -z "${{ secrets.E2E_AUTH_USER }}" || -z "${{ secrets.E2E_AUTH_PASS }}" ]]; then
            echo "::error::E2E_AUTH_USER and E2E_AUTH_PASS secrets must be set in the 'staging' environment"
            exit 1
          fi
          echo "✓ E2E secrets configured"

      - name: Deploy to staging
        env:
          AUTH_USER: ${{ secrets.E2E_AUTH_USER }}
          AUTH_PASS: ${{ secrets.E2E_AUTH_PASS }}
        run: |
          helm upgrade --install anra helm/anra/ \
            --namespace ${{ env.NAMESPACE }} --create-namespace \
            --set image.repository=${{ env.ECR_PUBLIC_URI }} \
            --set image.tag=${{ needs.build-and-push.outputs.image-tag }} \
            --set bedrock.region=${{ env.AWS_REGION }} \
            --set "webui.corsOrigins=*" \
            --set secrets.influxdbToken=anra-workshop-token \
            --set monitoring.influxdb.enabled=false \
            --set monitoring.telegraf.enabled=false \
            --set "nodeSelector=" \
            --wait --timeout 120s
          # Inject auth + AWS creds (not managed by Helm in test cluster)
          kubectl set env deployment/anra -n ${{ env.NAMESPACE }} \
            AUTH_USERNAME="${AUTH_USER}" \
            AUTH_PASSWORD="${AUTH_PASS}" \
            AWS_DEFAULT_REGION=${{ env.AWS_REGION }}
          kubectl rollout status deployment/anra -n ${{ env.NAMESPACE }} --timeout=90s

      - name: Run E2E tests
        env:
          AUTH_USER: ${{ secrets.E2E_AUTH_USER }}
          AUTH_PASS: ${{ secrets.E2E_AUTH_PASS }}
        run: |
          chmod +x scripts/e2e-test.sh
          ./scripts/e2e-test.sh --timeout 120

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "### Pod Status" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pod Logs (last 50 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl logs deployment/anra -n ${{ env.NAMESPACE }} --tail=50 >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── Create SIM Ticket on CI Failure ──
  notify-failure:
    runs-on: ubuntu-latest
    needs: [unit-tests, code-quality, security]
    if: failure()

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.IAM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine failed jobs
        id: failures
        run: |
          FAILED_JOBS=""
          if [[ "${{ needs.unit-tests.result }}" == "failure" ]]; then FAILED_JOBS="unit-tests"; fi
          if [[ "${{ needs.code-quality.result }}" == "failure" ]]; then FAILED_JOBS="${FAILED_JOBS:+$FAILED_JOBS, }code-quality"; fi
          if [[ "${{ needs.security.result }}" == "failure" ]]; then FAILED_JOBS="${FAILED_JOBS:+$FAILED_JOBS, }security"; fi
          echo "jobs=$FAILED_JOBS" >> $GITHUB_OUTPUT

      - name: Publish failure to SNS → Taskei ticket
        run: |
          aws sns publish \
            --topic-arn arn:aws:sns:us-west-2:833185305196:ci-failure-notifications \
            --subject "[CI FAILURE] ${{ github.workflow }} — ${{ steps.failures.outputs.jobs }}" \
            --message '{
              "repository": "${{ github.repository }}",
              "workflow": "${{ github.workflow }}",
              "ref": "${{ github.ref_name }}",
              "sha": "${{ github.sha }}",
              "actor": "${{ github.actor }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "jobs_failed": ["${{ steps.failures.outputs.jobs }}"],
              "event": "${{ github.event_name }}",
              "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
            }' \
            --region us-west-2
          echo "✓ Failure notification sent → SNS → Lambda → Taskei ticket"
