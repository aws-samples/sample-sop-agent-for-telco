name: Release

# Maintainer-only workflow — requires AWS credentials configured as secrets/OIDC.
# Triggered manually or by version tag (v*).
# Skips silently if AWS_ROLE_ARN secret is not configured (forks).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_PUBLIC_URI: public.ecr.aws/k6b9y4d0/sample-sop-agent-for-telco

jobs:
  check-credentials:
    name: Check release credentials
    runs-on: ubuntu-latest
    outputs:
      ecr_configured: ${{ steps.check.outputs.ecr_configured }}
      eks_configured: ${{ steps.check.outputs.eks_configured }}
    steps:
      - id: check
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
        run: |
          if [[ -n "$AWS_ROLE_ARN" ]]; then
            echo "ecr_configured=true" >> $GITHUB_OUTPUT
            echo "✓ AWS_ROLE_ARN configured — ECR push will run"
          else
            echo "ecr_configured=false" >> $GITHUB_OUTPUT
            echo "::warning::AWS_ROLE_ARN not configured — skipping ECR push. Forks should configure their own AWS account."
          fi
          if [[ -n "$AWS_ROLE_ARN" && -n "$EKS_CLUSTER_NAME" ]]; then
            echo "eks_configured=true" >> $GITHUB_OUTPUT
            echo "✓ EKS_CLUSTER_NAME configured — EKS E2E will run"
          else
            echo "eks_configured=false" >> $GITHUB_OUTPUT
            echo "::warning::EKS_CLUSTER_NAME not configured — skipping EKS E2E"
          fi

  push-to-ecr:
    name: Build and push to Public ECR
    runs-on: ubuntu-latest
    needs: [check-credentials]
    if: needs.check-credentials.outputs.ecr_configured == 'true'
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Public ECR
        run: |
          aws ecr-public get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin public.ecr.aws

      - name: Determine tag
        id: meta
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_INPUT_TAG: ${{ inputs.tag }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GH_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$GH_INPUT_TAG"
          else
            TAG="$GH_REF_NAME"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_PUBLIC_URI }}:${{ steps.meta.outputs.tag }}
            ${{ env.ECR_PUBLIC_URI }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### 🚀 Image Released" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** \`${{ steps.meta.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URI:** \`${{ env.ECR_PUBLIC_URI }}:${{ steps.meta.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Also tagged:** \`latest\`" >> $GITHUB_STEP_SUMMARY

  eks-e2e:
    name: EKS end-to-end test
    runs-on: ubuntu-latest
    needs: [check-credentials, push-to-ecr]
    if: needs.check-credentials.outputs.eks_configured == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy to test EKS
        env:
          AUTH_USER: ${{ secrets.E2E_AUTH_USER }}
          AUTH_PASS: ${{ secrets.E2E_AUTH_PASS }}
        run: |
          helm upgrade --install anra helm/anra/ \
            --namespace sop-agent --create-namespace \
            --set image.repository=${{ env.ECR_PUBLIC_URI }} \
            --set image.tag=${{ needs.push-to-ecr.outputs.image-tag }} \
            --set bedrock.region=${{ env.AWS_REGION }} \
            --set "webui.corsOrigins=*" \
            --set monitoring.influxdb.enabled=false \
            --set monitoring.telegraf.enabled=false \
            --set "nodeSelector=" \
            --wait --timeout 120s
          kubectl set env deployment/anra -n sop-agent \
            AUTH_USERNAME="${AUTH_USER}" \
            AUTH_PASSWORD="${AUTH_PASS}" \
            AWS_DEFAULT_REGION=${{ env.AWS_REGION }}
          kubectl rollout status deployment/anra -n sop-agent --timeout=90s

      - name: Run E2E test
        env:
          AUTH_USER: ${{ secrets.E2E_AUTH_USER }}
          AUTH_PASS: ${{ secrets.E2E_AUTH_PASS }}
        run: |
          chmod +x scripts/e2e-test.sh
          ./scripts/e2e-test.sh --timeout 120

      - name: Logs on failure
        if: failure()
        run: |
          kubectl get pods -n sop-agent
          kubectl logs deployment/anra -n sop-agent --tail=100 || true
