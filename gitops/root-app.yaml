# ArgoCD App-of-Apps — deploys all ANRA workloads
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: anra-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git@ssh.gitlab.aws.dev/awaizkh/autonomous-network-remediation-agent.git
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: false  # safety: don't delete resources not in Git yet
