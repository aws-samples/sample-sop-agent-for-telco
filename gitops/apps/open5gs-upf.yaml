apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open5gs-upf
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/aws-samples/sample-sop-agent-for-telco.git
    targetRevision: main
    path: gitops/base/open5gs-upf
  destination:
    server: https://kubernetes.default.svc
    namespace: open5gs
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
