apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: anra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/aws-samples/sample-sop-agent-for-telco.git
    targetRevision: main
    path: helm/anra
    helm:
      valueFiles:
        - examples/site-002-values.yaml
        - examples/ingress-cloudfront-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: anra
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
