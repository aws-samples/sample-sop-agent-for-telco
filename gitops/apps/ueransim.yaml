apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ueransim
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: ssh://git@ssh.gitlab.aws.dev/awaizkh/autonomous-network-remediation-agent.git
    targetRevision: main
    path: gitops/base/ueransim
  destination:
    server: https://kubernetes.default.svc
    namespace: srsran
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
