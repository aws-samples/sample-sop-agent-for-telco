apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/aws-samples/sample-sop-agent-for-telco.git
    targetRevision: main
    path: gitops/base/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: anra
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
