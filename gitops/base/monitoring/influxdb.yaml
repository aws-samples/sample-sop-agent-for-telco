apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: influxdb
spec:
  serviceName: influxdb
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      nodeSelector:
        role: region
      containers:
      - name: influxdb
        image: influxdb:2.7
        env:
        - {name: DOCKER_INFLUXDB_INIT_MODE, value: setup}
        - {name: DOCKER_INFLUXDB_INIT_USERNAME, value: admin}
        - {name: DOCKER_INFLUXDB_INIT_PASSWORD, value: adminpassword}
        - {name: DOCKER_INFLUXDB_INIT_ORG, value: srs}
        - {name: DOCKER_INFLUXDB_INIT_BUCKET, value: srsran}
        - {name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN, value: srsran-metrics-token}
        ports:
        - containerPort: 8086
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
spec:
  selector:
    app: influxdb
  ports:
  - port: 8086
