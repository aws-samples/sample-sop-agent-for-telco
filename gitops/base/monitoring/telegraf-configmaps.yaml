apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-ran-config
data:
  telegraf-ran.conf: |
    [agent]
      interval = "1s"
      flush_interval = "1s"
    [[inputs.execd]]
      command = ["python3", "/etc/srs/ws_adapter.py"]
      signal = "none"
      restart_delay = "5s"
      data_format = "json"
      json_strict = true
      name_override = "srsran"
    [[outputs.influxdb_v2]]
      urls = ["http://influxdb.anra.svc.cluster.local:8086"]
      token = "$INFLUX_TOKEN"
      organization = "srs"
      bucket = "srsran"
  ws_adapter.py: |
    #!/usr/bin/env python3
    from contextlib import suppress
    import os, json
    from time import sleep
    import websocket
    def _on_open(ws):
        ws.send(json.dumps({"cmd": "metrics_subscribe"}))
    def _on_message(_ws, message):
        with suppress(json.JSONDecodeError):
            metric = json.loads(message)
            if "cmd" not in metric:
                print(json.dumps(metric), flush=True)
    if __name__ == "__main__":
        ws_app = websocket.WebSocketApp(
            "ws://" + os.environ.get("WS_URL", "127.0.0.1:55555"),
            on_open=_on_open, on_message=_on_message)
        while True:
            try:
                ws_app.run_forever()
            except Exception:
                sleep(5)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-core-config
data:
  telegraf-core.conf: |
    [agent]
      interval = "15s"
      flush_interval = "15s"
    [[inputs.execd]]
      command = ["python3", "/etc/srs/core_collector.py"]
      signal = "none"
      data_format = "json"
      name_override = "core_network"
    [[outputs.influxdb_v2]]
      urls = ["http://influxdb.anra.svc.cluster.local:8086"]
      token = "$INFLUX_TOKEN"
      organization = "srs"
      bucket = "srsran"
  core_collector.py: |
    #!/usr/bin/env python3
    """Core network metrics collector — scrapes Open5GS Prometheus + kubectl pod status."""
    import json, subprocess, time
    
    CORE_NS = "open5gs"
    PROM_TARGETS = {
        "amf": "open5gs-amf-metrics.open5gs.svc.cluster.local:9090",
        "smf": "open5gs-smf-metrics.open5gs.svc.cluster.local:9090",
        "pcf": "open5gs-pcf-metrics.open5gs.svc.cluster.local:9090",
    }
    
    
    def run(args):
        try:
            r = subprocess.run(args, capture_output=True, text=True, timeout=10)
            return r.stdout
        except Exception:
            return ""
    
    
    def scrape_prom(url):
        raw = run(["curl", "-s", f"http://{url}/metrics"])
        metrics = {}
        for line in raw.strip().split("\n"):
            if line.startswith("#") or not line.strip():
                continue
            parts = line.split()
            if len(parts) >= 2:
                try:
                    metrics[parts[0]] = float(parts[1])
                except ValueError:
                    pass
        return metrics
    
    
    while True:
        m = {}
    
        # Scrape Prometheus from AMF, SMF, PCF
        for nf, target in PROM_TARGETS.items():
            for k, v in scrape_prom(target).items():
                if not k.startswith("process_"):
                    m[f"{nf}_{k}"] = v
    
        # kubectl pod status (always)
        out = run(["/usr/local/bin/kubectl", "get", "pods", "-n", CORE_NS, "--no-headers"])
        lines = [l for l in out.strip().split("\n") if l]
        running = sum(1 for l in lines if "Running" in l)
        m["core_nf_total"] = len(lines)
        m["core_nf_running"] = running
        m["core_nf_failed"] = len(lines) - running
        m["core_nf_health_pct"] = round(running / max(len(lines), 1) * 100, 1)
    
        print(json.dumps(m), flush=True)
        time.sleep(15)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-hw-config
data:
  telegraf-hw.conf: |
    [agent]
      interval = "30s"
      flush_interval = "30s"
    [[inputs.redfish]]
      address = "https://192.168.30.10"
      username = "root"
      password = "$BMC_PASSWORD"
      computer_system_id = "System.Embedded.1"
      insecure_skip_verify = true
      [inputs.redfish.tags]
        bmc_ip = "192.168.30.10"
    [[inputs.redfish]]
      address = "https://192.168.30.11"
      username = "root"
      password = "$BMC_PASSWORD"
      computer_system_id = "System.Embedded.1"
      insecure_skip_verify = true
      [inputs.redfish.tags]
        bmc_ip = "192.168.30.11"
    [[outputs.influxdb_v2]]
      urls = ["http://influxdb.anra.svc.cluster.local:8086"]
      token = "$INFLUX_TOKEN"
      organization = "srs"
      bucket = "srsran"
