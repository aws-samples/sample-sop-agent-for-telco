[project]
name = "anra-agentcore"
version = "0.1.0"
description = "ANRA agent for Amazon Bedrock AgentCore Runtime deployment"
requires-python = ">=3.11"
dependencies = [
    "bedrock-agentcore>=0.1.0",
    "strands-agents>=1.36.0",
    "strands-agents-evals>=0.1.15",
    "boto3>=1.34.0",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "requests>=2.31.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
observability = [
    "aws-opentelemetry-distro>=0.7.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main.py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
