apiVersion: apps/v1
kind: Deployment
metadata:
  name: anra
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anra.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "anra.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "anra.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: anra
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.webui.port }}
          env:
            - name: BEDROCK_REGION
              value: {{ .Values.bedrock.region | quote }}
            - name: AWS_REGION
              value: {{ .Values.ssm.region | quote }}
            - name: SSM_REGION
              value: {{ .Values.ssm.region | quote }}
            - name: INFLUX_URL
              value: {{ include "anra.influxdbUrl" . | quote }}
            - name: INFLUX_ORG
              value: {{ .Values.monitoring.influxdbOrg | quote }}
            - name: INFLUX_BUCKET
              value: {{ .Values.monitoring.influxdbBucket | quote }}
            - name: ALERTMANAGER_URL
              value: {{ include "anra.alertmanagerUrl" . | quote }}
            - name: APPROVAL_MODE
              value: {{ .Values.approval.mode | quote }}
            - name: ANRA_CONFIG
              value: /app/config/anra-config.yaml
            - name: SOP_REPO
              value: /app
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: anra-secrets
                  key: influxdb-token
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: logs
              mountPath: /app/logs
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: anra-config
        - name: logs
          emptyDir: {}
