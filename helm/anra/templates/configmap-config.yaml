apiVersion: v1
kind: ConfigMap
metadata:
  name: anra-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "anra.labels" . | nindent 4 }}
data:
  anra-config.yaml: |
    cluster:
      name: {{ .Values.config.cluster.name | quote }}
      context: {{ .Values.config.cluster.context | default .Values.config.cluster.name | quote }}
      region: {{ .Values.config.cluster.region | quote }}
    bedrock:
      region: {{ .Values.bedrock.region | quote }}
      profile: {{ .Values.bedrock.profile | quote }}
    monitoring:
      influxdb_url: {{ include "anra.influxdbUrl" . | quote }}
      influxdb_token_secret: anra-secrets
      influxdb_org: {{ .Values.monitoring.influxdbOrg | quote }}
      influxdb_bucket: {{ .Values.monitoring.influxdbBucket | quote }}
      alertmanager_url: {{ include "anra.alertmanagerUrl" . | quote }}
    {{- if .Values.config.nodes }}
    nodes:
      {{- toYaml .Values.config.nodes | nindent 6 }}
    {{- else }}
    nodes: []
    {{- end }}
    topology:
      provider: {{ .Values.config.topology.provider | default "yaml" | quote }}
      {{- if .Values.config.topology.endpoint }}
      endpoint: {{ .Values.config.topology.endpoint | quote }}
      {{- end }}
    approval:
      mode: {{ .Values.approval.mode | quote }}
    {{- if .Values.remediation }}
    remediation:
      mode: {{ .Values.remediation.mode | default "direct" | quote }}
      argocd_url: {{ .Values.remediation.argocd_url | default "http://argocd-server.argocd.svc:80" | quote }}
    {{- end }}
    {{- if .Values.config.alarms }}
    alarms:
      {{- toYaml .Values.config.alarms | nindent 6 }}
    {{- end }}
    {{- if .Values.config.guardrails }}
    guardrails:
      {{- toYaml .Values.config.guardrails | nindent 6 }}
    {{- end }}
    {{- if .Values.config.anomaly_detection }}
    anomaly_detection:
      {{- toYaml .Values.config.anomaly_detection | nindent 6 }}
    {{- end }}
