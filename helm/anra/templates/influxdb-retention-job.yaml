{{- if .Values.monitoring.influxdb.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: influxdb-set-retention
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: influxdb-retention
    app.kubernetes.io/part-of: {{ include "anra.fullname" . }}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: influx-cli
          image: influxdb:2.7
          command:
            - sh
            - -c
            - |
              sleep 10  # wait for influxdb to be ready
              influx bucket update \
                -n {{ .Values.monitoring.influxdb.bucket }} \
                --retention 24h \
                --host http://influxdb:8086 \
                --token {{ .Values.monitoring.influxdb.token | quote }}
          env:
            - name: INFLUX_HOST
              value: http://influxdb:8086
{{- end }}
