# ANRA values for site-002-workload (SJC38 Lab)
# Usage: helm install anra helm/anra -n anra --create-namespace -f helm/anra/examples/site-002-values.yaml

image:
  repository: 833542146025.dkr.ecr.us-west-1.amazonaws.com/anra
  tag: latest

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::833542146025:role/AnraRole

bedrock:
  region: us-west-2
  profile: cse-dev-test

approval:
  mode: auto

remediation:
  mode: gitops  # direct | gitops
  argocd_url: "http://argocd-server.argocd.svc:80"

config:
  cluster:
    name: site-002-workload
    context: site-002-workload
    region: us-west-1
  nodes:
    - name: dell-worker-1
      oam_ip: "192.168.31.195"
      ssm_id: mi-0c32a0cb4c4c06fdd
      bmc:
        ip: "192.168.30.10"
        type: idrac
        username: root
        password_secret: bmc-creds
      roles: [upf]
      namespaces: [open5gs]
    - name: dell-worker-2
      oam_ip: "192.168.31.222"
      ssm_id: mi-026bd2d584e205efb
      bmc:
        ip: "192.168.30.11"
        type: idrac
        username: root
        password_secret: bmc-creds
      roles: [du, cu]
      namespaces: [srsran]
  topology:
    provider: yaml

  # ── Alarm Rules ──
  alarms:
    # RAN (layer 3)
    - name: du_cpu_overload
      layer: 3
      source: ran
      field: du_du_high_mac_dl_0_cpu_usage_percent
      condition: "> 80"
      severity: critical
      depends_on: []
      nf_scope: per-node
      sop: day2-remediate/ran/remediate-du-cpu-overload.md
      service_impact: "DL/UL throughput degradation"
      probable_cause: "CPU contention, insufficient isolation"
    - name: du_timing_failure
      layer: 3
      source: ran
      field: cells_0_cell_metrics_error_indication_count
      condition: "> 500"
      severity: critical
      depends_on: [amf_gnb_disconnect, ptp_drift]
      nf_scope: per-node
      sop: day2-remediate/ran/remediate-du-timing-failure.md
      service_impact: "Cell outage, UE disconnections"
      probable_cause: "PTP drift, NIC timestamping, FAPI errors"
    - name: du_throughput_drop
      layer: 3
      source: ran
      field: cells_0_ue_list_0_dl_brate
      condition: "< 500000"
      severity: warning
      depends_on: [du_timing_failure, amf_gnb_disconnect]
      nf_scope: per-node
      service_impact: "Reduced user throughput"
      probable_cause: "CPU overload, interference, channel degradation"
    # Core (layer 2)
    - name: amf_gnb_disconnect
      layer: 2
      source: core
      field: amf_gnb
      condition: "< 1"
      severity: critical
      depends_on: [nf_crashloop, network_partition]
      nf_scope: per-instance
      sop: day2-remediate/core/remediate-amf-gnb-disconnect.md
      service_impact: "gNB isolated, all UEs lose service"
      probable_cause: "SCTP failure, AMF crash, network partition"
    - name: amf_registration_failure
      layer: 2
      source: core
      field: amf_fivegs_amffunction_rm_reginitfail
      condition: "> 0"
      severity: critical
      depends_on: [nf_crashloop]
      nf_scope: per-instance
      service_impact: "UEs cannot register"
      probable_cause: "Auth chain broken (AUSF/UDM/UDR/MongoDB)"
    - name: amf_auth_rejection
      layer: 2
      source: core
      field: amf_fivegs_amffunction_amf_authreject
      condition: "> 0"
      severity: critical
      depends_on: [nf_crashloop]
      nf_scope: per-instance
      service_impact: "Authentication failing"
      probable_cause: "Subscriber credentials mismatch"
    - name: smf_pfcp_failure
      layer: 2
      source: core
      field: smf_fivegs_smffunction_sm_n4sessionestabfail
      condition: "> 0"
      severity: critical
      depends_on: [network_partition]
      nf_scope: per-instance
      sop: day2-remediate/core/remediate-upf-pfcp-loss.md
      service_impact: "Cannot establish PDU sessions"
      probable_cause: "UPF unreachable, cross-CNI routing"
    - name: upf_no_traffic
      layer: 2
      source: core
      field: upf_fivegs_ep_n3_gtp_indatapktn3upf
      condition: "== 0"
      severity: warning
      depends_on: [amf_gnb_disconnect, smf_pfcp_failure]
      nf_scope: per-instance
      service_impact: "No user plane traffic"
      probable_cause: "No PDU sessions, UPF routing broken"
    - name: sbi_mesh_failure
      layer: 2
      source: core
      field: alarm_scp_timeout
      condition: "> 0"
      severity: critical
      depends_on: [nf_crashloop]
      nf_scope: site-wide
      service_impact: "NF-to-NF communication broken"
      probable_cause: "SCP down, DNS failure"
    - name: nf_crashloop
      layer: 2
      source: core
      field: core_nf_health_pct
      condition: "< 95"
      severity: critical
      depends_on: [network_partition]
      nf_scope: per-instance
      sop: day2-remediate/core/remediate-nf-crashloop.md
      service_impact: "Degraded core network"
      probable_cause: "OOM, config error, dependency unavailable"
    # Infrastructure (layer 1)
    - name: network_partition
      layer: 1
      source: core
      field: node_not_ready
      condition: "> 0"
      severity: critical
      depends_on: []
      nf_scope: site-wide
      sop: day2-remediate/infra/remediate-network-partition.md
      service_impact: "RAN isolated from core"
      probable_cause: "VPN tunnel down, routing change"
    - name: ptp_drift
      layer: 1
      source: ran
      field: ptp_offset_ns
      condition: "> 1500"
      severity: critical
      depends_on: []
      nf_scope: per-node
      sop: day2-remediate/infra/remediate-ptp-drift.md
      service_impact: "TDD scheduling failure"
      probable_cause: "Grandmaster unreachable"
    - name: memory_pressure
      layer: 1
      source: os
      field: node_pressure_memory_stalled_seconds_total
      condition: "> 10"
      severity: critical
      depends_on: []
      nf_scope: per-node
      service_impact: "Pod evictions, OOM kills"
      probable_cause: "Memory leak, overcommit"
    - name: high_cpu_steal
      layer: 1
      source: os
      field: node_cpu_steal_percent
      condition: "> 5"
      severity: warning
      depends_on: []
      nf_scope: per-node
      service_impact: "Latency increase"
      probable_cause: "Noisy neighbor on shared host"

  # ── Anomaly Detection ──
  anomaly_detection:
    enabled: true
    baseline_samples: 10
    sigma_threshold: 3
    max_sops_per_hour: 3
    testmode: true

  # ── Safety Guardrails ──
  guardrails:
    protected_namespaces: [srsran, open5gs, anra, kube-system]
    blocked_commands:
      - "scale.*--replicas.*0"
      - "delete deployment"
      - "delete statefulset"
      - "delete namespace"
    approval_mode: auto

secrets:
  influxdbToken: srsran-metrics-token
  bmcPassword: calvin

monitoring:
  influxdbUrl: "http://influxdb.anra.svc.cluster.local:8086"
  influxdbOrg: srs
  influxdbBucket: srsran

influxdb:
  enabled: true

telegraf:
  ran:
    enabled: true
    gnbHost: "192.168.31.222"
    gnbPort: 55555
  core:
    enabled: true
    coreNamespace: open5gs
  hw:
    enabled: true
    bmcTargets:
      - ip: "192.168.30.10"
        username: root
      - ip: "192.168.30.11"
        username: root

alertmanager:
  enabled: false

webui:
  service:
    type: NodePort
    nodePort: 30080

ssm:
  region: us-west-1
