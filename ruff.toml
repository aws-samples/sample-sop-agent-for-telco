target-version = "py311"
line-length = 120

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "S",     # flake8-bandit
    "T20",   # flake8-print (warn on print statements)
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module-import-not-at-top (used for sys.path manipulation)
    "E702",   # multiple statements on one line (used in compact dicts)
    "E722",   # bare except (legacy code)
    "E741",   # ambiguous variable name (e.g. `l`)
    "S602",   # subprocess with shell=True (intentional in SOP executor)
    "S603",   # subprocess without shell=True (intentional)
    "S404",   # import subprocess (intentional)
    "S101",   # assert (used in tests)
    "S104",   # hardcoded bind all interfaces (intentional for container)
    "S108",   # hardcoded temp file paths (legacy code)
    "S110",   # try-except-pass (tech debt — tracked for Phase 1 fix)
    "S112",   # try-except-continue (tech debt)
    "S607",   # start process with partial path (intentional for kubectl/git)
    "T201",   # print (used for CLI output in agent)
    "B008",   # function call in default argument (used in FastAPI Depends)
    "B904",   # raise without from inside except (tech debt)
    "B007",   # unused loop control variable (style preference)
    "B905",   # zip without explicit strict (tech debt)
    "N802",   # function name lowercase (some test class methods)
    "N803",   # argument name lowercase
    "N806",   # non-lowercase variable in function (e.g. MODELS)
    "UP007",  # Use X | Y for union types (keep Optional for 3.9 compat)
    "UP042",  # replace str enum (legacy code)
    "UP017", # datetime.UTC alias (workshop uses timezone.utc)
    "UP031", # printf string formatting (workshop style)
    "UP045", # non-pep604 Optional annotation (workshop style)
    "F821",   # undefined name (dynamic imports via sys.path)
    "F841",   # unused variable (tech debt)
    "SIM105", # suppressible exception (style preference)
    "SIM108", # if-else vs ternary (style preference)
    "SIM102", # collapsible if (style preference)
    "SIM114", # combinable if branches (style preference)
    "RUF001", # ambiguous unicode (intentional emoji)
    "RUF002", # ambiguous unicode in docstring (intentional σ symbol)
    "RUF013", # implicit Optional (workshop style)
    "RUF005", # collection literal concatenation (style)
    "RUF015", # unnecessary iterable allocation (style)
]

[lint.per-file-ignores]
"tests/*" = ["S101", "S106", "B011", "F401"]
"agent/sop_executor.py" = ["T201"]
"agent/model_discovery.py" = ["T201"]
"agent/api.py" = ["F811"]

[format]
quote-style = "double"
indent-style = "space"
