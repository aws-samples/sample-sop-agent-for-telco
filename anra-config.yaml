# ANRA Site Configuration
# Fill in during deployment — describes your infrastructure topology.
# deploy.sh can auto-generate this by discovering SSM instances and prompting for BMC IPs.

cluster:
  name: site-002-workload
  context: site-002-workload
  region: us-west-1

bedrock:
  region: us-west-2
  profile: cse-dev-test

monitoring:
  influxdb_url: http://influxdb.srsran.svc.cluster.local:8086
  influxdb_token_secret: influx-creds       # K8s Secret name
  influxdb_org: srs
  influxdb_bucket: srsran
  alertmanager_url: ""                       # optional

nodes:
  - name: dell-worker-1
    oam_ip: 192.168.31.195
    ssm_id: mi-0c32a0cb4c4c06fdd
    bmc:
      ip: 192.168.30.10
      type: idrac                            # idrac | ilo | generic-redfish
      username: root
      password_secret: bmc-creds             # K8s Secret name, key=password
    roles: [upf]
    namespaces: [open5gs]

  - name: dell-worker-2
    oam_ip: 192.168.31.222
    ssm_id: mi-026bd2d584e205efb
    bmc:
      ip: 192.168.30.11
      type: idrac
      username: root
      password_secret: bmc-creds
    roles: [du, cu]
    namespaces: [srsran]

# Topology provider: yaml (single site) | neptune (multi-site scale)
topology:
  provider: yaml
  # endpoint: cloudran-neptune-cluster.cluster-xxx.neptune.amazonaws.com  # uncomment for Neptune

# Alarm reference files to load (vendor-specific)
alarm_references:
  - alarm-references/generic-5g.json

# Approval mode: auto (execute immediately) | manual (log only) | gitlab
approval:
  mode: auto

# Alarm rules — extracted from agent/monitor.py:387-449
# Operators: > < >= <= == absent_for rate any all at_least
alarms:
  # ─── RAN alarms (source: ran) ───
  - name: du_cpu_overload
    source: ran
    metric_field: du_du_high_mac_dl_0_cpu_usage_percent
    condition: "> 80"
    severity: warning
    sop: workshop-remediate/remediate-du-cpu-overload.md
    service_impact: "DU CPU overload — degraded radio performance"
    probable_cause: "Compute saturation, missing CPU pinning, or hyperthreading interference"

  - name: du_timing_failure
    source: ran
    metric_field: cells_0_cell_metrics_error_indication_count
    condition: "> 500"
    severity: critical
    sop: workshop-remediate/remediate-du-timing.md
    service_impact: "DU timing failure — UE will fail to attach"
    probable_cause: "PTP sync loss, GPS lost, or fronthaul timing breakdown"

  - name: du_throughput_drop
    source: ran
    metric_field: cells_0_ue_list_0_dl_brate
    condition: "< 500000"
    severity: warning
    sop: ""
    service_impact: "Per-UE downlink rate below 500 Kbps"
    probable_cause: "RF interference, congested cell, or poor signal"

  # ─── Core alarms (source: core) ───
  - name: amf_gnb_disconnect
    source: core
    metric_field: amf_gnb
    condition: "< 1"
    severity: critical
    sop: workshop-remediate/remediate-amf-gnb-disconnect.md
    service_impact: "No active gNB connections at AMF"
    probable_cause: "N2 interface broken, gNB pod down, or routing issue"

  - name: nf_crashloop
    source: core
    metric_field: core_nf_health_pct
    condition: "< 95"
    severity: critical
    sop: workshop-remediate/remediate-nf-crashloop.md
    service_impact: "Degraded core network — dependent NFs may fail"
    probable_cause: "OOM kill, config error, dependency unavailable, image pull failure"

  - name: sbi_mesh_failure
    source: core
    metric_field: alarm_scp_timeout
    condition: "> 0"
    severity: critical
    sop: ""
    service_impact: "SBI mesh failure — control plane communication broken"
    probable_cause: "SCP unhealthy, NRF unreachable, or service mesh policy error"

  - name: amf_registration_failure
    source: core
    metric_field: amf_fivegs_amffunction_rm_reginitfail
    condition: "> 0"
    severity: warning
    sop: ""
    service_impact: "UE registration failures at AMF"
    probable_cause: "AUSF/UDM unreachable, subscriber not provisioned, or auth vector failure"

  - name: amf_auth_rejection
    source: core
    metric_field: amf_fivegs_amffunction_amf_authreject
    condition: "> 0"
    severity: warning
    sop: ""
    service_impact: "Authentication rejections at AMF"
    probable_cause: "Subscriber credentials invalid, AUSF SUCI decryption error, or replay protection trigger"

  - name: smf_pfcp_failure
    source: core
    metric_field: smf_fivegs_smffunction_sm_n4sessionestabfail
    condition: "> 0"
    severity: critical
    sop: workshop-remediate/remediate-upf-pfcp-loss.md
    service_impact: "Cannot establish new PDU sessions"
    probable_cause: "UPF unreachable, PFCP association lost, cross-CNI routing broken"

  - name: upf_no_traffic
    source: core
    metric_field: upf_fivegs_ep_n3_gtp_indatapktn3upf
    condition: "== 0"
    severity: warning
    sop: ""
    service_impact: "No N3 GTP traffic at UPF"
    probable_cause: "No active UE sessions, DU/CU disconnected, or N3 routing failure"

  # ─── OS alarms (source: kubernetes / os_metrics) ───
  - name: os_memory_pressure
    source: kubernetes
    metric_field: node_memory_available_pct
    condition: "< 5"
    severity: critical
    sop: examples/day2-remediate/infra/remediate-os-memory-pressure.md
    service_impact: "Node memory pressure — OOM kills imminent"
    probable_cause: "Memory leak in NF, undersized node, or hugepages misconfiguration"

  # ─── Missing-NF detection (NEW) ───
  - name: amf_missing
    source: core
    metric_pattern: "amf_fivegs_*"
    condition: "absent_for 60s"
    severity: critical
    sop: workshop-remediate/remediate-nf-crashloop.md
    service_impact: "AMF not reporting metrics — pod down or scaled to 0"
    probable_cause: "Pod scaled to 0, evicted, crashed, or Telegraf scrape failure"

  - name: smf_missing
    source: core
    metric_pattern: "smf_fivegs_*"
    condition: "absent_for 60s"
    severity: critical
    sop: workshop-remediate/remediate-nf-crashloop.md
    service_impact: "SMF not reporting metrics — cannot establish new PDU sessions"
    probable_cause: "Pod scaled to 0, evicted, crashed, or Telegraf scrape failure"

  - name: upf_missing
    source: core
    metric_pattern: "upf_fivegs_*"
    condition: "absent_for 60s"
    severity: critical
    sop: workshop-remediate/remediate-upf-pfcp-loss.md
    service_impact: "UPF not reporting metrics — data plane down"
    probable_cause: "Pod scaled to 0, evicted, crashed, or Telegraf scrape failure"

  - name: ausf_missing
    source: core
    metric_pattern: "ausf_*"
    condition: "absent_for 90s"
    severity: critical
    sop: workshop-remediate/remediate-nf-crashloop.md
    service_impact: "AUSF not reporting — UE authentication will fail"
    probable_cause: "Pod scaled to 0, evicted, crashed, or Telegraf scrape failure"

  - name: udm_missing
    source: core
    metric_pattern: "udm_*"
    condition: "absent_for 90s"
    severity: critical
    sop: workshop-remediate/remediate-nf-crashloop.md
    service_impact: "UDM not reporting — subscriber data lookups will fail"
    probable_cause: "Pod scaled to 0, evicted, crashed, or Telegraf scrape failure"

  - name: nrf_missing
    source: core
    metric_pattern: "nrf_*"
    condition: "absent_for 90s"
    severity: critical
    sop: workshop-remediate/remediate-nf-crashloop.md
    service_impact: "NRF not reporting — NF discovery will fail"
    probable_cause: "Pod scaled to 0, evicted, crashed, or Telegraf scrape failure"
